<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifle Click Isolator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0c0a09;
            color: #f5f5f4;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.08s ease-out;
        }

        .container {
            background: #1c1917;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid #2e2a24;
            width: 360px;
            box-sizing: border-box;
        }

        button {
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background-color: #ef4444;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            width: 100%;
        }

        button:hover { background-color: #dc2626; }
        button:active { transform: scale(0.98); }

        .dashboard {
            display: none;
        }

        .control-group {
            margin-bottom: 20px;
            background: #141210;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #2e2a24;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #a8a29e;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .value-display {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f43f5e;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #ef4444;
            margin: 0;
        }

        .meter-container {
            width: 100%;
            height: 12px;
            background-color: #292524;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            margin-top: 6px;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            background-color: #f43f5e;
            transition: width 0.03s linear;
        }

        .threshold-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ffffff;
            box-shadow: 0 0 4px #fff;
        }

        .status {
            text-align: center;
            font-size: 0.85rem;
            color: #78716c;
            margin-top: 15px;
        }

        body.click-triggered {
            background-color: #ef4444;
            transition: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin:0 0 6px 0; font-size: 1.5rem; letter-spacing: -0.02em;">Acoustic Click Isolator</h2>
        <p style="color:#a8a29e; font-size:0.85rem; margin:0 0 24px 0;">Fine-tune parameters to separate fast transients from sliding metallic friction.</p>
        
        <button id="startBtn">Calibrate Microphone</button>
        
        <div id="dashboard" class="dashboard">
            <!-- Control 1: Velocity Spike Filter -->
            <div class="control-group">
                <div class="slider-header">
                    <label for="spikeSlider">Spike Threshold (Delta)</label>
                    <span id="spikeVal" class="value-display">60</span>
                </div>
                <input type="range" id="spikeSlider" min="20" max="150" value="60">
                <div class="meter-container">
                    <div id="deltaBar" class="meter-bar"></div>
                    <div id="deltaThresholdLine" class="threshold-line"></div>
                </div>
            </div>

            <!-- Control 2: High Pass Filter Cutoff -->
            <div class="control-group">
                <div class="slider-header">
                    <label for="freqSlider">Treble Cutoff Frequency</label>
                    <span id="freqVal" class="value-display">5500 Hz</span>
                </div>
                <input type="range" id="freqSlider" min="2000" max="9000" step="250" value="5500">
                <p style="font-size:0.75rem; color:#78716c; margin: 6px 0 0 0;">Raises wall to block deeper clunking reload sounds.</p>
            </div>
            
            <div class="status">⚡ Loop running at raw frame speed</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const dashboard = document.getElementById('dashboard');
        const spikeSlider = document.getElementById('spikeSlider');
        const spikeVal = document.getElementById('spikeVal');
        const freqSlider = document.getElementById('freqSlider');
        const freqVal = document.getElementById('freqVal');
        const deltaBar = document.getElementById('deltaBar');
        const deltaThresholdLine = document.getElementById('deltaThresholdLine');

        let audioCtx, analyser, highPassFilter, dataArray;
        let previousVolume = 0;
        let lastTriggerTime = 0;
        const COOLDOWN = 350; 

        // Live parameter updates
        function updateParameters() {
            spikeVal.innerText = spikeSlider.value;
            freqVal.innerText = freqSlider.value + " Hz";
            
            if (highPassFilter) {
                highPassFilter.frequency.value = parseFloat(freqSlider.value);
            }
            
            // Map threshold visually to 0-150 bar width scales
            const pct = (spikeSlider.value / 150) * 100;
            deltaThresholdLine.style.left = pct + "%";
        }

        spikeSlider.addEventListener('input', updateParameters);
        freqSlider.addEventListener('input', updateParameters);

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false, 
                        autoGainControl: false
                    } 
                });

                startBtn.style.display = 'none';
                dashboard.style.display = 'block';
                updateParameters();

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);

                highPassFilter = audioCtx.createBiquadFilter();
                highPassFilter.type = "highpass";
                highPassFilter.frequency.value = parseFloat(freqSlider.value); 

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; // High time resolution
                
                source.connect(highPassFilter);
                highPassFilter.connect(analyser);

                dataArray = new Uint8Array(analyser.frequencyBinCount);
                processAudio();

            } catch (err) {
                alert('Audio configuration failed. Ensure secure context (HTTPS/Localhost).');
            }
        });

        function processAudio() {
            analyser.getByteFrequencyData(dataArray);

            let highFreqPeak = 0;
            for (let i = 0; i < dataArray.length; i++) {
                if (dataArray[i] > highFreqPeak) {
                    highFreqPeak = dataArray[i];
                }
            }

            // Delta evaluates how violently the loudness exploded frame-to-frame
            let spikeVelocity = highFreqPeak - previousVolume;
            if (spikeVelocity < 0) spikeVelocity = 0;

            // Render live velocity bar
            const deltaPct = (spikeVelocity / 150) * 100;
            deltaBar.style.width = Math.min(deltaPct, 100) + '%';

            const now = Date.now();
            const activeThreshold = parseInt(spikeSlider.value);
            
            if (spikeVelocity > activeThreshold && (now - lastTriggerTime) > COOLDOWN) {
                triggerVisual();
                lastTriggerTime = now;
            }

            previousVolume = highFreqPeak;
            requestAnimationFrame(processAudio);
        }

        function triggerVisual() {
            document.body.classList.add('click-triggered');
            setTimeout(() => document.body.classList.remove('click-triggered'), 70);
        }
    </script>
</body>
</html>
