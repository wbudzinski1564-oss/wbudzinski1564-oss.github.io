<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dry Fire</title>
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100dvh; min-height: -webkit-fill-available; background: #f5f5f4; color: #1c1917; font-family: system-ui, sans-serif; overflow: hidden; position: relative; }
        .page-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .setup-panel { background: #1c1917; color: #f5f5f4; padding: 40px; text-align: center; z-index: 100; flex-direction: column; }
        .setup-content { max-width: 440px; width: 100%; margin: auto; }
        .main-streak-badge { font-size: 1.2rem; font-weight: 700; color: #f43f5e; background: #141210; padding: 12px 24px; border-radius: 50px; display: inline-block; border: 1px solid #2e2a24; margin: 10px 0; }
        .selector-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #a8a29e; margin-bottom: 10px; display: block; }
        .segmented-control { display: flex; background: #141210; padding: 4px; border-radius: 12px; border: 1px solid #2e2a24; margin-bottom: 25px; }
        .segment-btn { flex: 1; padding: 10px; font-size: 0.95rem; font-weight: 600; background: transparent; color: #a8a29e; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s, color 0.2s; }
        .segment-btn.active { background-color: #ef4444; color: #ffffff; }
        .action-btn { padding: 16px 32px; font-size: 1.3rem; font-weight: 700; border: none; border-radius: 12px; background-color: #ef4444; color: white; cursor: pointer; transition: transform 0.1s, background-color 0.2s; width: 100%; }
        .action-btn:hover { background-color: #dc2626; }
        .action-btn:active { transform: scale(0.98); }
        .calibration-view { display: none; z-index: 50; }
        .calibration-controls, .target-controls-top-hub { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(28, 25, 23, 0.95); padding: 12px 24px; border-radius: 30px; display: flex; align-items: center; width: 95vw; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(10px); }
        .calibration-controls { gap: 20px; max-width: 750px; }
        .calibration-controls input[type="range"], .slider-flex-container input[type="range"] { flex-grow: 1; accent-color: #ef4444; background: transparent; }
        .target-view { display: none; z-index: 10; }
        .target-array { display: flex; justify-content: center; align-items: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .target-dot { background-color: #000000; border-radius: 50%; transition: opacity 0.05s ease-out; opacity: 1; flex-shrink: 0; }
        .target-dot.hit { opacity: 0; pointer-events: none; }
        .target-controls-top-hub { color: #f5f5f4; max-width: 850px; justify-content: space-between; gap: 16px; transition: opacity 0.4s, visibility 0.4s; opacity: 1; }
        .target-controls-top-hub.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .streak-pill-text { background: #141210; border: 1px solid #2e2a24; padding: 6px 14px; border-radius: 20px; font-weight: 700; color: #f43f5e; font-size: 1rem; white-space: nowrap; }
        .slider-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #a8a29e; letter-spacing: 0.05em; white-space: nowrap; }
        .slider-flex-container { flex-grow: 1; display: flex; align-items: center; gap: 12px; }
        .meter-container { width: 45px; height: 8px; background: #2e2a24; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .meter-bar { height: 100%; width: 0%; background: #ef4444; transition: width 0.05s ease-out, background-color 0.1s; }
        .value-display { font-variant-numeric: tabular-nums; font-weight: 700; color: #f5f5f4; min-width: 28px; text-align: right; font-size: 0.95rem; }
        .back-arrow-btn { background: #2e2a24; border: 1px solid #44403c; color: #f5f5f4; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background 0.2s; flex-shrink: 0; }
        .back-arrow-btn:hover { background: #44403c; }
        .rotation-blocker { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #1c1917; color: #f5f5f4; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        @media (orientation: portrait) { .rotation-blocker { display: flex; } }
        .phone-icon { width: 50px; height: 80px; border: 3px solid #ef4444; border-radius: 8px; position: relative; animation: rotateDevice 2s ease-in-out infinite; margin-bottom: 20px; }
        .phone-icon::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; background: #ef4444; border-radius: 50%; }
        @keyframes rotateDevice { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }
    </style>
</head>
<body>

    <div class="rotation-blocker">
        <div class="phone-icon"></div>
        <h3>Please Rotate Device</h3>
        <p>Dry Fire requires Landscape Mode to optimize target presentation layout.</p>
    </div>

    <div id="setupPanel" class="page-layer setup-panel">
        <div class="setup-content">
            <h2 style="font-size: 2.5rem; margin: 0 0 10px 0;">Dry Fire</h2>
            <div id="welcomeStreak" class="main-streak-badge">🔥 0 Days Practice Streak</div>
            <span class="selector-label" style="margin-top: 20px;">Target Flow Direction</span>
            <div class="segmented-control">
                <button type="button" id="leftwardBtn" class="segment-btn active">Leftward</button>
                <button type="button" id="rightwardBtn" class="segment-btn">Rightward</button>
            </div>
            <button id="beginBtn" class="action-btn">Begin</button>
        </div>
    </div>

    <div id="calibrationView" class="page-layer calibration-view">
        <div class="calibration-controls">
            <span class="slider-label" style="color: #f5f5f4;">Adjust Target Size</span>
            <input type="range" id="sizeSlider" min="15" max="120" value="45">
            <button id="startTrainingBtn" class="action-btn" style="margin: 0; padding: 10px 20px; font-size: 1rem; width: auto;">Start Training</button>
            <button id="calBackBtn" class="back-arrow-btn">↩</button>
        </div>
        <div id="calibrationDot" class="target-dot"></div>
    </div>

    <div id="targetView" class="page-layer target-view">
        <div id="controlHud" class="target-controls-top-hub">
            <div id="streakCounter" class="streak-pill-text">🔥 0</div>
            <div class="slider-label">Sens:</div>
            <div class="slider-flex-container">
                <input type="range" id="spikeSlider" min="20" max="150" value="90">
                <div class="meter-container"><div id="deltaBar" class="meter-bar"></div></div>
            </div>
            <span id="spikeVal" class="value-display">90</span>
            <button id="backBtn" class="back-arrow-btn">↩</button>
        </div>
        <div id="targetArray" class="target-array">
            <div class="target-dot" id="target1"></div>
            <div class="target-dot" id="target2"></div>
            <div class="target-dot" id="target3"></div>
            <div class="target-dot" id="target4"></div>
            <div class="target-dot" id="target5"></div>
        </div>
    </div>
    <script>
        let flowDirection = 'leftward', currentSize = 45, sensitivityThreshold = 90;
        let activeTargetIndex = 0, currentStreak = 0, hudTimeout = null;
        let audioCtx = null, micStream = null, anaNode = null, dataArray = null;

        const el = id => document.getElementById(id);
        const views = { setup: el('setupPanel'), cal: el('calibrationView'), train: el('targetView') };
        const targets = [el('target1'), el('target2'), el('target3'), el('target4'), el('target5')];

        function initStreak() {
            const last = localStorage.getItem('df_last_date'), streak = parseInt(localStorage.getItem('df_streak') || '0', 10);
            if (last) {
                const diff = (new Date().setHours(0,0,0,0) - new Date(last).setHours(0,0,0,0)) / 86400000;
                currentStreak = diff <= 1 ? streak : 0;
            }
            updateStreakDisplay();
        }

        function recordSession() {
            const today = new Date().toDateString(), last = localStorage.getItem('df_last_date');
            if (last !== today) {
                currentStreak = (last && (new Date().setHours(0,0,0,0) - new Date(last).setHours(0,0,0,0)) / 86400000 <= 1) ? currentStreak + 1 : 1;
                localStorage.setItem('df_last_date', today);
                localStorage.setItem('df_streak', currentStreak);
                updateStreakDisplay();
            }
        }

        function updateStreakDisplay() {
            el('welcomeStreak').innerText = `🔥 ${currentStreak} Days Practice Streak`;
            el('streakCounter').innerText = `🔥 ${currentStreak}`;
        }

        function switchView(viewName) {
            Object.values(views).forEach(v => v.style.display = 'none');
            if (viewName === 'setup') views.setup.style.display = 'flex';
            else if (viewName === 'cal') { views.cal.style.display = 'flex'; updateCalSize(); }
            else if (viewName === 'train') { views.train.style.display = 'flex'; startTrainingSession(); }
        }

        function updateCalSize() {
            currentSize = el('sizeSlider').value;
            el('calibrationDot').style.width = el('calibrationDot').style.height = `${currentSize}px`;
        }

        function setDirection(dir) {
            flowDirection = dir;
            el('leftwardBtn').classList.toggle('active', dir === 'leftward');
            el('rightwardBtn').classList.toggle('active', dir === 'rightward');
            el('targetArray').style.flexDirection = dir === 'leftward' ? 'row' : 'row-reverse';
        }

        function beep(freq, duration) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function startTrainingSession() {
            recordSession();
            resetTargets();
            showHud();
            if (!micStream) initAudioContainer();
        }

        function resetTargets() {
            activeTargetIndex = 0;
            targets.forEach(t => {
                t.className = 'target-dot';
                t.style.width = t.style.height = `${currentSize}px`;
                t.style.margin = `0 ${currentSize * 0.75}px`;
                t.style.backgroundColor = '#000000';
            });
        }

        function triggerHit() {
            if (activeTargetIndex >= 5) return;
            beep(880, 0.1);
            targets[activeTargetIndex].classList.add('hit');
            activeTargetIndex++;
            if (activeTargetIndex < 5) targets[activeTargetIndex].style.backgroundColor = '#ef4444';
            else setTimeout(() => { beep(1200, 0.25); setTimeout(resetTargets, 600); }, 150);
        }

        function showHud() {
            el('controlHud').classList.remove('hidden');
            clearTimeout(hudTimeout);
            hudTimeout = setTimeout(() => { if(activeTargetIndex < 5) el('controlHud').classList.add('hidden'); }, 3000);
        }

        async function initAudioContainer() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let src = audioCtx.createMediaStreamSource(micStream);
                anaNode = audioCtx.createAnalyser(); anaNode.fftSize = 256;
                src.connect(anaNode);
                dataArray = new Uint8Array(anaNode.frequencyBinCount);
                processAudioLoop();
            } catch (err) { alert('Microphone access denied or unavailable.'); }
        }

        function processAudioLoop() {
            if (!anaNode) return;
            requestAnimationFrame(processAudioLoop);
            anaNode.getByteFrequencyData(dataArray);
            let peak = 0;
            for (let i = 2; i < 40; i++) if (dataArray[i] > peak) peak = dataArray[i];
            let pct = Math.min(100, (peak / 255) * 100);
            el('deltaBar').style.width = `${pct}%`;
            el('deltaBar').style.backgroundColor = peak >= sensitivityThreshold ? '#22c55e' : '#ef4444';
            if (peak >= sensitivityThreshold && activeTargetIndex < 5) triggerHit();
        }

        el('leftwardBtn').onclick = () => setDirection('leftward');
        el('rightwardBtn').onclick = () => setDirection('rightward');
        el('beginBtn').onclick = () => switchView('cal');
        el('calBackBtn').onclick = () => switchView('setup');
        el('sizeSlider').oninput = updateCalSize;
        el('startTrainingBtn').onclick = () => switchView('train');
        el('backBtn').onclick = () => switchView('cal');
        window.onclick = showHud;
        el('spikeSlider').oninput = (e) => { sensitivityThreshold = e.target.value; el('spikeVal').innerText = sensitivityThreshold; };

        initStreak();
    </script>
</body>
</html>
