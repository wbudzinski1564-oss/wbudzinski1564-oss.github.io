<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dry Fire</title>
    <style>
        /* Force total viewport coverage and remove scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Lock canvas directly to viewport edges */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none; /* Hidden until play button is pressed */
        }

        /* Centralized Main Menu Overlay */
        #mainMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            color: #000000;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .play-btn {
            padding: 15px 40px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #000000;
            border: 2px solid #000000;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .play-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- Main Menu Layout -->
    <div id="mainMenu">
        <h1>Dry Fire</h1>
        <button class="play-btn" onclick="startGame()">Play</button>
    </div>

    <!-- Full Screen Animation Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('mainMenu');

        // Dynamic viewport resize calculator
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // Dot Properties
        let radius = 15;
        let x, y;
        let dx = 2; 
        let dy = 2; 

        // Main Rendering Loop
        function animate() {
            // Draw clear white frame
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the black dot
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            ctx.closePath();

            // Screen boundary bounce checks
            if (x + dx > canvas.width - radius || x + dx < radius) {
                dx = -dx;
            }
            if (y + dy > canvas.height - radius || y + dy < radius) {
                dy = -dy;
            }

            // Apply slow movement vector
            x += dx;
            y += dy;

            requestAnimationFrame(animate);
        }

        // Triggered when clicking the Play button
        function startGame() {
            // 1. Hide the main menu overlay
            mainMenu.style.display = 'none';
            
            // 2. Unhide and size the canvas
            canvas.style.display = 'block';
            resizeCanvas();

            // 3. Set starting dot coordinates to the screen center
            x = canvas.width / 2;
            y = canvas.height / 2;

            // 4. Start engine loop
            animate();
        }
    </script>
</body>
</html>
