<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Sound A Detector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        button {
            padding: 16px 32px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            margin-bottom: 25px;
        }
        button:disabled { background-color: #475569; }
        .event-box {
            font-size: 30px;
            font-weight: bold;
            padding: 30px;
            border-radius: 12px;
            background-color: #1e293b;
            transition: background 0.05s ease;
            min-height: 40px;
            border: 2px solid #334155;
        }
        .event-a { 
            background-color: #0284c7; 
            border-color: #38bdf8;
            color: white; 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        .debug {
            margin-top: 20px;
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: #94a3b8;
        }
        .debug div { margin-bottom: 5px; }
        .highlight { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sound A Precision Detector</h1>
    <p>Uses Transient Attack Rate + Spectral Concentration Ratio</p>

    <button id="startButton">Start Listening</button>

    <div id="display" class="event-box">Inactive</div>

    <div class="debug">
        <div>Target Band Energy: <span id="target-e" class="highlight">0</span></div>
        <div>Surround Band Energy: <span id="surround-e" class="highlight">0</span></div>
        <div>Spectral Ratio (Target/Total): <span id="ratio-val" class="highlight">0</span></div>
        <div>Status: <span id="log">Click Start to begin.</span></div>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startButton');
    const displayDiv = document.getElementById('display');
    const targetE = document.getElementById('target-e');
    const surroundE = document.getElementById('surround-e');
    const ratioVal = document.getElementById('ratio-val');
    const logDiv = document.getElementById('log');

    let audioContext;
    let analyser;
    let isListening = false;
    let isProcessing = false;

    startBtn.addEventListener('click', async () => {
        if (isListening) return;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false 
                } 
            });
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            
            // 128 FFT gives ultra-fast frame updates (~2.6ms per frame)
            analyser.fftSize = 128;
            analyser.smoothingTimeConstant = 0.0; // Zero smoothing for maximum transient speed

            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            isListening = true;
            startBtn.disabled = true;
            displayDiv.innerText = "Listening...";
            logDiv.innerText = "Active and processing...";

            analyzeAudio();
        } catch (err) {
            alert("Microphone error: " + err.message);
        }
    });

    function analyzeAudio() {
        const bufferLength = analyser.frequencyBinCount; // 64 bins
        const freqData = new Uint8Array(bufferLength);

        // At 48kHz sample rate, each bin is ~375Hz wide
        // Bins 4 to 7 = ~1500Hz - 2625Hz (Sound A's core pop resonance)
        // Bins 0-3 & 8-20 = Lows, Mids & Highs (Clap wideband noise)

        function frame() {
            if (!isListening) return;

            analyser.getByteFrequencyData(freqData);

            // 1. Calculate Target Pop Band Energy
            let popEnergy = 0;
            for (let i = 4; i <= 7; i++) {
                popEnergy += freqData[i];
            }
            popEnergy /= 4;

            // 2. Calculate Surrounding/Wideband Energy
            let wideEnergy = 0;
            let wideCount = 0;
            // Lower bins (rumble/bass)
            for (let i = 0; i <= 2; i++) { wideEnergy += freqData[i]; wideCount++; }
            // Higher bins (clap splash)
            for (let i = 9; i <= 22; i++) { wideEnergy += freqData[i]; wideCount++; }
            wideEnergy /= wideCount;

            // 3. Spectral Concentration Ratio
            const total = popEnergy + wideEnergy;
            const concentrationRatio = total > 0 ? (popEnergy / total) : 0;

            // Update Debug View
            targetE.innerText = Math.round(popEnergy);
            surroundE.innerText = Math.round(wideEnergy);
            ratioVal.innerText = concentrationRatio.toFixed(2);

            // DETECTION CONDITION:
            // Sound A requires:
            // - Strong energy in its specific pop band (> 35)
            // - High concentration ratio (> 0.58) meaning it's NOT a wideband clap
            if (!isProcessing) {
                if (popEnergy > 35 && concentrationRatio > 0.58) {
                    triggerSoundA(popEnergy, concentrationRatio);
                }
            }

            requestAnimationFrame(frame);
        }

        frame();
    }

    function triggerSoundA(energy, ratio) {
        isProcessing = true;
        displayDiv.innerText = "SOUND A DETECTED!";
        displayDiv.className = "event-box event-a";
        logDiv.innerText = `Triggered! (Energy: ${Math.round(energy)}, Ratio: ${ratio.toFixed(2)})`;

        setTimeout(() => {
            displayDiv.innerText = "Listening...";
            displayDiv.className = "event-box";
            isProcessing = false;
        }, 300);
    }
</script>
</body>
</html>
