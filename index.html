<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dry Fire</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f5f4; 
            color: #1c1917;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: fixed; /* Prevents bounce scrolling or layout clipping */
        }

        /* Fullscreen Layout Engine */
        .page-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Initial Entry Configuration Frame */
        .setup-panel {
            background: #1c1917;
            color: #f5f5f4;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid #2e2a24;
            width: 85vw;
            max-width: 400px;
            text-align: center;
            z-index: 100;
        }

        button {
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background-color: #ef4444;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            width: 100%;
            margin-top: 15px;
        }

        button:hover { background-color: #dc2626; }
        button:active { transform: scale(0.98); }

        /* Active Training Field Canvas */
        .target-view {
            display: none; 
            z-index: 10;
        }

        /* 1/2 Size Target Dot (45px) perfectly dead-centered */
        .target-dot {
            width: 45px;
            height: 45px;
            background-color: #000000;
            border-radius: 50%;
            transition: opacity 0.05s ease-out;
            opacity: 1;
        }

        .target-dot.hit {
            opacity: 0;
            pointer-events: none;
        }

        /* FIXED: Moved to top center and completely clear of any phone notches/bezels */
        .target-controls-top-hub {
            position: absolute;
            top: max(15px, env(safe-area-inset-top)); 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 25, 23, 0.96);
            color: #f5f5f4;
            padding: 10px 20px;
            border-radius: 30px;
            width: 90vw;
            max-width: 520px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            transition: opacity 0.4s ease, visibility 0.4s;
            opacity: 1;
            visibility: visible;
            z-index: 30;
        }

        .target-controls-top-hub.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Internal layout elements for the unified top hub */
        .streak-pill-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f5f5f4;
            white-space: nowrap;
        }

        .slider-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a8a29e;
        }

        .slider-flex-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 220px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #ef4444;
            margin: 0;
            padding: 6px 0;
        }

        .meter-container {
            width: 100%;
            height: 4px;
            background-color: #292524;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-top: 1px;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            background-color: #f43f5e;
            transition: width 0.03s linear;
        }

        .threshold-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ffffff;
            box-shadow: 0 0 4px #fff;
        }

        .value-display {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f43f5e;
            min-width: 25px;
            text-align: right;
        }

        .inline-gear-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 0 0 5px;
            margin: 0;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .inline-gear-btn:hover { opacity: 1; }

        /* Full Screen Rotation Guard Overlay */
        .rotation-blocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0c0a09;
            color: #f5f5f4;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .phone-icon {
            width: 45px;
            height: 75px;
            border: 3px solid #f5f5f4;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        @media screen and (orientation: portrait) {
            .setup-panel, .target-view {
                display: none !important;
            }
            .rotation-blocker {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <div class="rotation-blocker">
        <div class="phone-icon"></div>
        <h3 style="margin: 0 0 8px 0; font-size: 1.3rem;">Please Rotate Device</h3>
        <p style="color: #a8a29e; font-size: 0.9rem; max-width: 260px; margin: 0;">Dry Fire requires Landscape Mode to optimize target presentation layout.</p>
    </div>

    <!-- First Page Frame -->
    <div id="setupPanel" class="page-layer setup-panel">
        <div>
            <h2 style="margin:0 0 4px 0; font-size: 1.8rem; letter-spacing: -0.02em;">Dry Fire</h2>
            <p style="color:#a8a29e; font-size:0.85rem; margin:0 0 10px 0;">Tap begin to launch the training center target frame.</p>
            <div id="welcomeStreak" style="font-size: 0.95rem; margin-bottom: 5px; color: #f43f5e; font-weight: bold;"></div>
            <button id="beginBtn">Begin</button>
        </div>
    </div>

    <!-- Active Practice Arena Screen Container -->
    <div id="targetView" class="page-layer target-view">
        
        <!-- FIXED UNIFIED TOP HUD CONTROL BAR -->
        <div id="controlHud" class="target-controls-top-hub">
            <div id="streakCounter" class="streak-pill-text">🔥 0 days</div>
            
            <div class="slider-label">Sens</div>
            <div class="slider-flex-container">
                <input type="range" id="spikeSlider" min="20" max="150" value="90">
                <div class="meter-container">
                    <div id="deltaBar" class="meter-bar"></div>
                    <div id="deltaThresholdLine" class="threshold-line"></div>
                </div>
            </div>
            <span id="spikeVal" class="value-display">90</span>
            
            <button id="gearBtn" class="inline-gear-btn">⚙️</button>
        </div>
        
        <!-- The Target Center Dot -->
        <div id="targetDot" class="target-dot"></div>
    </div>
    <script>
        const setupPanel = document.getElementById('setupPanel');
        const targetView = document.getElementById('targetView');
        const beginBtn = document.getElementById('beginBtn');
        const gearBtn = document.getElementById('gearBtn');
        
        const spikeSlider = document.getElementById('spikeSlider');
        const spikeVal = document.getElementById('spikeVal');
        const deltaBar = document.getElementById('deltaBar');
        const deltaThresholdLine = document.getElementById('deltaThresholdLine');
        const controlHud = document.getElementById('controlHud');
        const streakCounter = document.getElementById('streakCounter');
        const welcomeStreak = document.getElementById('welcomeStreak');

        let audioCtx, analyser, highPassFilter, dataArray;
        let previousVolume = 0;
        let lastTriggerTime = 0;
        let systemInitialized = false;
        let hudTimeout;
        
        const RESPAWN_DELAY = 2000; 
        const HARDCODED_FREQ = 9000; 

        function updateParameters() {
            spikeVal.innerText = spikeSlider.value;
            const pct = (spikeSlider.value / 150) * 100;
            deltaThresholdLine.style.left = pct + "%";
            resetHudTimeout();
        }

        function resetHudTimeout() {
            clearTimeout(hudTimeout);
            controlHud.classList.remove('hidden');
            hudTimeout = setTimeout(() => {
                if (targetView.style.display === 'flex') {
                    controlHud.classList.add('hidden');
                }
            }, 4000); 
        }

        spikeSlider.addEventListener('input', updateParameters);
        window.addEventListener('mousemove', resetHudTimeout);
        window.addEventListener('touchstart', resetHudTimeout);
        updateParameters();

        function checkAndRenderStreak(isNewHit = false) {
            const todayStr = new Date().toDateString();
            let storedStreak = parseInt(localStorage.getItem('df_streak_count')) || 0;
            let lastDateStr = localStorage.getItem('df_last_practice_date');

            if (!isNewHit) {
                if (lastDateStr) {
                    const todayObj = new Date(todayStr);
                    const lastObj = new Date(lastDateStr);
                    const diffTime = Math.abs(todayObj - lastObj);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays > 1) {
                        storedStreak = 0;
                        localStorage.setItem('df_streak_count', 0);
                    }
                }
                
                if (storedStreak > 0) {
                    welcomeStreak.innerText = `Current Practice Streak: 🔥 ${storedStreak} Days`;
                }
                streakCounter.innerText = `🔥 ${storedStreak} day${storedStreak !== 1 ? 's' : ''}`;
                return;
            }

            if (lastDateStr !== todayStr) {
                storedStreak += 1;
                localStorage.setItem('df_streak_count', storedStreak);
                localStorage.setItem('df_last_practice_date', todayStr);
                streakCounter.innerText = `🔥 ${storedStreak} day${storedStreak !== 1 ? 's' : ''}`;
            }
        }

        checkAndRenderStreak();

        beginBtn.addEventListener('click', async () => {
            if (!systemInitialized) {
                await initializeAudioSubsystem();
            }
            if (systemInitialized) {
                setupPanel.style.display = 'none';
                targetView.style.display = 'flex';
                resetHudTimeout();
            }
        });

        gearBtn.addEventListener('click', () => {
            targetView.style.display = 'none';
            setupPanel.style.display = 'flex';
            clearTimeout(hudTimeout);
            controlHud.classList.remove('hidden');
        });

        async function initializeAudioSubsystem() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                const source = audioCtx.createMediaStreamSource(stream);

                highPassFilter = audioCtx.createBiquadFilter();
                highPassFilter.type = "highpass";
                highPassFilter.frequency.value = HARDCODED_FREQ; 

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; 
                
                source.connect(highPassFilter);
                highPassFilter.connect(analyser);

                dataArray = new Uint8Array(analyser.frequencyBinCount);
                systemInitialized = true;

                processAudioLoop();
            } catch (err) {
                alert('Microphone initialization failed. Please check browser configuration handles.');
            }
        }

        function processAudioLoop() {
            analyser.getByteFrequencyData(dataArray);

            let highFreqPeak = 0;
            for (let i = 0; i < dataArray.length; i++) {
                if (dataArray[i] > highFreqPeak) {
                    highFreqPeak = dataArray[i];
                }
            }

            let spikeVelocity = highFreqPeak - previousVolume;
            if (spikeVelocity < 0) spikeVelocity = 0;

            const deltaPct = (spikeVelocity / 150) * 100;
            deltaBar.style.width = Math.min(deltaPct, 100) + '%';

            const now = Date.now();
            const activeThreshold = parseInt(spikeSlider.value);

            if (spikeVelocity > activeThreshold && (now - lastTriggerTime) > RESPAWN_DELAY) {
                triggerTargetHit();
                lastTriggerTime = now;
            }

            previousVolume = highFreqPeak;
            requestAnimationFrame(processAudioLoop);
        }

        function triggerTargetHit() {
            const targetDot = document.getElementById('targetDot');
            if (targetDot) targetDot.classList.add('hit');
            
            checkAndRenderStreak(true);

            setTimeout(() => {
                const currentDot = document.getElementById('targetDot');
                if (currentDot) currentDot.remove();
                
                const newDot = document.createElement('div');
                newDot.id = 'targetDot';
                newDot.className = 'target-dot';
                targetView.appendChild(newDot);
            }, RESPAWN_DELAY);
        }
    </script>
</body>
</html>
