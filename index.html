<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0">

<title>Adaptive Sound Detector</title>



<style>

    body {

        font-family: system-ui, sans-serif;

        max-width: 650px;

        margin: 30px auto;

        padding: 0 20px;

    }



    button {

        padding: 12px 18px;

        margin: 5px;

        font-size: 16px;

        cursor: pointer;

    }



    input[type="range"] {

        width: 100%;

    }



    .box {

        border: 1px solid #ccc;

        border-radius: 10px;

        padding: 15px;

        margin: 15px 0;

    }



    #status {

        font-size: 20px;

        font-weight: bold;

        margin: 15px 0;

    }



    #probability {

        font-size: 36px;

        font-weight: bold;

    }



    #meter {

        height: 20px;

        background: #ddd;

        border-radius: 10px;

        overflow: hidden;

    }



    #meterFill {

        height: 100%;

        width: 0%;

        background: #555;

    }



    .small {

        color: #666;

        font-size: 14px;

    }

</style>

</head>



<body>



<h1>Adaptive Sound Detector</h1>



<button id="startButton">Start Microphone</button>



<div id="status">Waiting...</div>



<div class="box">

    <div>Click probability</div>

    <div id="probability">—</div>

</div>



<div class="box">

    <div>Input level</div>

    <div id="meter">

        <div id="meterFill"></div>

    </div>

</div>



<div class="box">

    <label>

        Input gain:

        <span id="gainValue">100%</span>

    </label>

    <input id="gain" type="range"

           min="25" max="400" value="100">

</div>



<div class="box">

    <label>

        Detection sensitivity:

        <span id="sensitivityValue">75%</span>

    </label>

    <input id="sensitivity" type="range"

           min="0" max="100" value="75">

</div>



<div class="box">

    <strong>Live learning</strong>

    <p>

        Click examples:

        <span id="clickCount">0</span>

    </p>

    <p>

        Reload examples:

        <span id="reloadCount">0</span>

    </p>



    <button id="resetLearning">

        Reset learned examples

    </button>



    <p class="small">

        Only high-confidence detections are added to the

        adaptive model. The default examples are never deleted.

    </p>

</div>



<script>



/* ============================================================

   DEFAULT TRAINING DATA

   ============================================================



   These are representative normalized features derived from

   the supplied recording.



   Each example contains:



   [spectrum × 8, temporal envelope × 12,

    duration, zero-crossing rate]



   The values are normalized, so absolute microphone volume

   matters much less.

   ============================================================ */



const DEFAULT_CLICKS = [

    {

        spectrum: [

            .006, .020, .129, .221,

            .217, .196, .127, .085

        ],



        envelope: [

            .05,.18,.43,.82,1.00,.76,

            .48,.27,.14,.08,.04,.02

        ],



        duration: 0.105,

        zcr: 0.19

    },



    /* Slight variations make the default model less brittle. */



    {

        spectrum: [

            .007,.021,.132,.224,

            .214,.194,.125,.083

        ],



        envelope: [

            .04,.20,.46,.84,1.00,.74,

            .46,.25,.13,.07,.04,.02

        ],



        duration: 0.115,

        zcr: 0.20

    }

];





const DEFAULT_RELOADS = [

    {

        spectrum: [

            .005,.015,.159,.209,

            .268,.175,.106,.064

        ],



        envelope: [

            .03,.10,.22,.42,.65,.82,

            .94,1.00,.91,.76,.58,.40

        ],



        duration: 0.276,

        zcr: 0.16

    },



    {

        spectrum: [

            .005,.022,.129,.211,

            .226,.174,.127,.107

        ],



        envelope: [

            .04,.22,.48,.79,1.00,.72,

            .45,.29,.17,.10,.05,.02

        ],



        duration: 0.127,

        zcr: 0.19

    },



    /* Additional slight variations */



    {

        spectrum: [

            .005,.021,.130,.214,

            .229,.177,.125,.104

        ],



        envelope: [

            .03,.20,.45,.76,.98,.76,

            .47,.30,.18,.10,.05,.02

        ],



        duration: 0.135,

        zcr: 0.20

    }

];





/* ============================================================

   SETTINGS

   ============================================================ */



let audioContext;

let microphone;

let gainNode;

let analyser;



let running = false;



let gainAmount = 1.0;



let sensitivity = 0.75;



let lastDetection = 0;



const COOLDOWN = 300;





/* ============================================================

   ADAPTIVE DATASET

   ============================================================ */



let learnedClicks = [];

let learnedReloads = [];





/* ============================================================

   UI

   ============================================================ */



const startButton =

    document.getElementById("startButton");



const status =

    document.getElementById("status");



const probability =

    document.getElementById("probability");



const gainSlider =

    document.getElementById("gain");



const gainValue =

    document.getElementById("gainValue");



const sensitivitySlider =

    document.getElementById("sensitivity");



const sensitivityValue =

    document.getElementById("sensitivityValue");



const meterFill =

    document.getElementById("meterFill");



const clickCount =

    document.getElementById("clickCount");



const reloadCount =

    document.getElementById("reloadCount");



const resetButton =

    document.getElementById("resetLearning");





/* ============================================================

   CONTROLS

   ============================================================ */



gainSlider.addEventListener("input", () => {



    gainAmount =

        Number(gainSlider.value) / 100;



    gainValue.textContent =

        gainSlider.value + "%";

});





sensitivitySlider.addEventListener("input", () => {



    sensitivity =

        Number(sensitivitySlider.value) / 100;



    sensitivityValue.textContent =

        sensitivitySlider.value + "%";

});





resetButton.addEventListener("click", () => {



    learnedClicks = [];

    learnedReloads = [];



    updateCounts();



    status.textContent =

        "Learned examples reset";

});





function updateCounts() {



    clickCount.textContent =

        DEFAULT_CLICKS.length +

        learnedClicks.length;



    reloadCount.textContent =

        DEFAULT_RELOADS.length +

        learnedReloads.length;

}



updateCounts();





/* ============================================================

   START MICROPHONE

   ============================================================ */



startButton.addEventListener("click", startMicrophone);





async function startMicrophone() {



    if (running)

        return;



    try {



        const stream =

            await navigator.mediaDevices.getUserMedia({



                audio: {

                    echoCancellation: false,

                    noiseSuppression: false,

                    autoGainControl: false,

                    channelCount: 1

                }

            });



        audioContext =

            new (window.AudioContext ||

                 window.webkitAudioContext)();



        microphone =

            audioContext.createMediaStreamSource(stream);



        gainNode =

            audioContext.createGain();



        analyser =

            audioContext.createAnalyser();



        analyser.fftSize = 2048;



        analyser.smoothingTimeConstant = 0.03;



        gainNode.gain.value =

            gainAmount;



        microphone

            .connect(gainNode)

            .connect(analyser);



        running = true;



        startButton.disabled = true;



        status.textContent =

            "Listening...";



        detect();



    } catch (error) {



        console.error(error);



        status.textContent =

            "Microphone permission failed";

    }

}





/* ============================================================

   BUFFERS

   ============================================================ */



const timeData =

    new Float32Array(2048);



const frequencyData =

    new Float32Array(1024);





/* ============================================================

   ADAPTIVE NOISE FLOOR

   ============================================================ */



let noiseFloor = 0.003;





/* ============================================================

   MAIN DETECTION LOOP

   ============================================================ */



function detect() {



    if (!running)

        return;



    analyser.getFloatTimeDomainData(timeData);



    analyser.getFloatFrequencyData(frequencyData);





    /* ---------- RMS ---------- */



    let sum = 0;



    for (let i = 0; i < timeData.length; i++) {



        sum += timeData[i] *

               timeData[i];

    }



    const rms =

        Math.sqrt(sum / timeData.length);





    /* ---------- Display level ---------- */



    const displayLevel =

        Math.min(

            100,

            rms * 500

        );



    meterFill.style.width =

        displayLevel + "%";





    /* ---------- Adaptive noise floor ---------- */



    if (rms < noiseFloor * 2.5) {



        noiseFloor =

            noiseFloor * 0.995 +

            rms * 0.005;

    }





    const threshold =

        Math.max(

            0.008,

            noiseFloor *

            (3.0 - sensitivity * 1.8)

        );





    if (rms > threshold) {



        const now =

            performance.now();



        if (now - lastDetection >

            COOLDOWN) {



            lastDetection = now;



            const event =

                extractFeatures(

                    timeData,

                    frequencyData

                );



            classify(event);

        }

    }





    requestAnimationFrame(detect);

}





/* ============================================================

   FEATURE EXTRACTION

   ============================================================ */



function extractFeatures(time, freq) {



    /* ---------- Peak ---------- */



    let peak = 0;



    for (let i = 0; i < time.length; i++) {



        peak =

            Math.max(

                peak,

                Math.abs(time[i])

            );

    }





    /* ---------- Energy ---------- */



    let energy = 0;



    for (let i = 0; i < time.length; i++) {



        energy +=

            time[i] * time[i];

    }



    energy /=

        time.length;





    /* ---------- Zero crossing rate ---------- */



    let crossings = 0;



    for (let i = 1; i < time.length; i++) {



        if (

            (time[i] >= 0 &&

             time[i - 1] < 0) ||



            (time[i] < 0 &&

             time[i - 1] >= 0)

        ) {

            crossings++;

        }

    }



    const zcr =

        crossings / time.length;





    /* ---------- Duration ---------- */



    const duration =

        calculateDuration(

            time,

            peak

        );





    /* ---------- Spectrum ---------- */



    const spectrum =

        extractSpectrum(freq);





    /* ---------- Temporal envelope ---------- */



    const envelope =

        extractEnvelope(

            time

        );





    return {

        spectrum,

        envelope,

        duration,

        zcr

    };

}





/* ============================================================

   SPECTRUM

   ============================================================ */



function extractSpectrum(freq) {



    const bands = [

        [200,500],

        [500,1000],

        [1000,2000],

        [2000,3000],

        [3000,5000],

        [5000,8000],

        [8000,12000],

        [12000,16000]

    ];



    const sampleRate =

        audioContext.sampleRate;



    const fftSize =

        analyser.fftSize;



    const result = [];



    let total = 0;





    for (const [low, high] of bands) {



        const lowBin =

            Math.floor(

                low * fftSize /

                sampleRate

            );



        const highBin =

            Math.min(

                freq.length - 1,

                Math.ceil(

                    high * fftSize /

                    sampleRate

                )

            );



        let sum = 0;



        for (

            let i = lowBin;

            i <= highBin;

            i++

        ) {



            const db = freq[i];



            const amplitude =

                Math.pow(

                    10,

                    db / 20

                );



            sum += amplitude;

        }



        result.push(sum);



        total += sum;

    }





    if (total === 0)

        return result.map(() => 0);



    return result.map(

        x => x / total

    );

}





/* ============================================================

   TEMPORAL ENVELOPE

   ============================================================ */



function extractEnvelope(time) {



    const bins = 12;



    const size =

        Math.floor(

            time.length / bins

        );



    const result = [];



    let maximum = 0;





    for (let b = 0; b < bins; b++) {



        let sum = 0;



        for (

            let i = 0;

            i < size;

            i++

        ) {



            const index =

                b * size + i;



            sum +=

                time[index] *

                time[index];

        }



        const rms =

            Math.sqrt(

                sum / size

            );



        result.push(rms);



        maximum =

            Math.max(

                maximum,

                rms

            );

    }





    if (maximum === 0)

        return result.map(() => 0);



    return result.map(

        x => x / maximum

    );

}





/* ============================================================

   DURATION

   ============================================================ */



function calculateDuration(

    time,

    peak

) {



    if (peak <= 0)

        return 0;



    const threshold =

        peak * 0.20;



    let first = -1;

    let last = -1;





    for (let i = 0; i < time.length; i++) {



        if (

            Math.abs(time[i]) >

            threshold

        ) {



            if (first === -1)

                first = i;



            last = i;

        }

    }





    if (first === -1)

        return 0;





    return (

        (last - first) /

        audioContext.sampleRate

    );

}





/* ============================================================

   DISTANCE FUNCTION

   ============================================================ */



function distance(a, b) {



    let distance = 0;





    /* Spectrum */



    for (let i = 0; i < 8; i++) {



        const d =

            a.spectrum[i] -

            b.spectrum[i];



        distance +=

            d * d * 5;

    }





    /* Temporal envelope */



    for (let i = 0; i < 12; i++) {



        const d =

            a.envelope[i] -

            b.envelope[i];



        distance +=

            d * d * 2;

    }





    /* Duration */



    const durationDifference =

        Math.abs(

            a.duration -

            b.duration

        );



    distance +=

        durationDifference * 4;





    /* ZCR */



    const zcrDifference =

        Math.abs(

            a.zcr -

            b.zcr

        );



    distance +=

        zcrDifference * 1.5;





    return Math.sqrt(distance);

}





/* ============================================================

   GET ALL TRAINING EXAMPLES

   ============================================================ */



function allClicks() {



    return [

        ...DEFAULT_CLICKS,

        ...learnedClicks

    ];

}





function allReloads() {



    return [

        ...DEFAULT_RELOADS,

        ...learnedReloads

    ];

}





/* ============================================================

   CLASSIFICATION

   ============================================================ */



function classify(event) {



    const clicks =

        allClicks();



    const reloads =

        allReloads();





    let closestClick =

        Infinity;



    let closestReload =

        Infinity;





    for (const example of clicks) {



        closestClick =

            Math.min(

                closestClick,

                distance(

                    event,

                    example

                )

            );

    }





    for (const example of reloads) {



        closestReload =

            Math.min(

                closestReload,

                distance(

                    event,

                    example

                )

            );

    }





    /*

       Convert relative distance into probability.



       Smaller distance = better match.

    */



    const clickProbability =

        closestReload /

        (

            closestClick +

            closestReload

        );





    probability.textContent =

        Math.round(

            clickProbability * 100

        ) + "%";





    /* ========================================================

       CONFIDENCE REQUIREMENTS

       ======================================================== */



    /*

       Higher sensitivity means we require less separation.



       At 75%:

       required probability ≈ 0.60



       At 100%:

       required probability ≈ 0.50



       At lower sensitivity:

       the detector becomes more conservative.

    */



    const requiredProbability =

        0.50 +

        (1 - sensitivity) * 0.20;





    const strongClick =

        clickProbability >

        requiredProbability;





    const strongReload =

        clickProbability <

        (1 - requiredProbability);





    if (strongClick) {



        status.textContent =

            "CLICK DETECTED";



        /*

           Learn only when classification

           is sufficiently confident.

        */



        if (clickProbability > 0.85) {



            addLearnedExample(

                learnedClicks,

                event

            );

        }



        triggerAction();



    } else if (strongReload) {



        status.textContent =

            "Reload sound";



        if (clickProbability < 0.15) {



            addLearnedExample(

                learnedReloads,

                event

            );

        }



    } else {



        status.textContent =

            "Uncertain";

    }





    updateCounts();

}





/* ============================================================

   LIVE LEARNING

   ============================================================ */



const MAX_LEARNED =

    100;





function addLearnedExample(

    array,

    example

) {



    /*

       Don't learn identical consecutive

       examples unnecessarily.

    */



    if (array.length > 0) {



        const last =

            array[array.length - 1];



        if (

            distance(

                example,

                last

            ) < 0.03

        ) {

            return;

        }

    }





    array.push(

        structuredClone(example)

    );





    /*

       Keep memory bounded.



       Newer examples replace the oldest

       learned examples, while the default

       model remains permanent.

    */



    if (array.length >

        MAX_LEARNED) {



        array.shift();

    }

}





/* ============================================================

   ACTION

   ============================================================ */



function triggerAction() {



    /*

       Put whatever you want triggered here.



       Example:

       document.body.style.background =

           "lightgreen";



       Or call another JavaScript

       function.

    */



    console.log(

        "TARGET SOUND DETECTED"

    );

}





/* ============================================================

   INITIALIZE

   ============================================================ */



updateCounts();



</script>



</body>

</html>
