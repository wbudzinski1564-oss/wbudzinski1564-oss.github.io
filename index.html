<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dry Fire</title>
</head>
<body>

    <!-- Landscape Blocker Overlay -->
    <div class="rotation-blocker">
        <div class="phone-icon"></div>
        <h3>Please Rotate Device</h3>
        <p>Dry Fire requires Landscape Mode to optimize target presentation layout.</p>
    </div>

    <!-- Screen 1: Welcome / Main Menu Window -->
    <div id="setupPanel" class="page-layer setup-panel">
        <div class="setup-content">
            <h2 style="font-size: 2.5rem; margin: 0 0 10px 0;">Dry Fire</h2>
            
            <div id="welcomeStreak" class="main-streak-badge">🔥 0 Days Practice Streak</div>
            
            <span class="selector-label" style="margin-top: 20px;">Target Flow Direction</span>
            <div class="segmented-control">
                <button type="button" id="leftwardBtn" class="segment-btn active">Leftward</button>
                <button type="button" id="rightwardBtn" class="segment-btn">Rightward</button>
            </div>

            <button id="beginBtn" class="action-btn">Begin</button>
        </div>
    </div>

    <!-- Screen 2: Size Calibration Arena Screen -->
    <div id="calibrationView" class="page-layer calibration-view">
        <div class="calibration-controls">
            <span class="slider-label" style="color: #f5f5f4;">Adjust Target Size</span>
            <input type="range" id="sizeSlider" min="15" max="120" value="45">
            <button id="startTrainingBtn" class="action-btn" style="margin: 0; padding: 10px 20px; font-size: 1rem; width: auto;">Start Training</button>
            <button id="calBackBtn" class="back-arrow-btn" aria-label="Back to main menu">↩</button>
        </div>
        <div id="calibrationDot" class="target-dot"></div>
    </div>

    <!-- Screen 3: Active Practice Training Arena Container -->
    <div id="targetView" class="page-layer target-view">
        <div id="controlHud" class="target-controls-top-hub">
            <div id="streakCounter" class="streak-pill-text">🔥 0</div>
            
            <!-- CHANGED: Extended to 'Sensitivity:' label string -->
            <div class="slider-label">Sensitivity:</div>
            
            <div class="slider-flex-container">
                <input type="range" id="spikeSlider" min="20" max="150" value="90">
                <div class="meter-container">
                    <div id="deltaBar" class="meter-bar"></div>
                </div>
            </div>
            
            <span id="spikeVal" class="value-display">90</span>
            
            <button id="backBtn" class="back-arrow-btn" aria-label="Back to size calibration">↩</button>
        </div>
        
        <!-- NEW: Active Runtime Shot Timer Display HUD Overlay -->
        <div id="shotTimerHud" class="shot-timer-hud">0.00s</div>
        
        <!-- 5 Horizontal Array Targets -->
        <div id="targetArray" class="target-array">
            <div class="target-dot" id="target1"></div>
            <div class="target-dot" id="target2"></div>
            <div class="target-dot" id="target3"></div>
            <div class="target-dot" id="target4"></div>
            <div class="target-dot" id="target5"></div>
        </div>
    </div>
<style>
    * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
    }
    
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100dvh; 
        min-height: -webkit-fill-available;
        background-color: #f5f5f4; 
        color: #1c1917;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        position: relative;
    }

    .page-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .setup-panel {
        background: #1c1917;
        color: #f5f5f4;
        width: 100%;
        height: 100%;
        padding: 40px;
        text-align: center;
        z-index: 100;
        flex-direction: column;
    }

    .setup-content {
        max-width: 440px;
        width: 100%;
        margin: auto;
    }

    .main-streak-badge {
        font-size: 1.2rem;
        font-weight: 700;
        color: #f43f5e;
        background: #141210;
        padding: 12px 24px;
        border-radius: 50px;
        display: inline-block;
        border: 1px solid #2e2a24;
        margin: 10px 0;
    }

    .selector-label {
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #a8a29e;
        margin-bottom: 10px;
        display: block;
    }

    .segmented-control {
        display: flex;
        background: #141210;
        padding: 4px;
        border-radius: 12px;
        border: 1px solid #2e2a24;
        margin-bottom: 25px;
    }

    .segment-btn {
        flex: 1;
        padding: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        background: transparent;
        color: #a8a29e;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 0;
        transition: background-color 0.2s, color 0.2s;
    }

    .segment-btn.active {
        background-color: #ef4444;
        color: #ffffff;
    }

    .action-btn {
        padding: 16px 32px;
        font-size: 1.3rem;
        font-weight: 700;
        border: none;
        border-radius: 12px;
        background-color: #ef4444;
        color: white;
        cursor: pointer;
        transition: transform 0.1s, background-color 0.2s;
        width: 100%;
    }

    .action-btn:hover { background-color: #dc2626; }
    .action-btn:active { transform: scale(0.98); }

    .calibration-view {
        display: none;
        z-index: 50;
    }

    .calibration-controls {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(28, 25, 23, 0.95);
        padding: 12px 24px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        gap: 20px;
        width: 95vw;
        max-width: 750px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
    }

    .calibration-controls input[type="range"] {
        flex-grow: 1;
        accent-color: #ef4444;
        background: transparent;
    }

    .target-view {
        display: none; 
        z-index: 10;
    }

    /* NEW: Live Shot Runtime Display HUD styling positioned directly over central layout array */
    .shot-timer-hud {
        position: absolute;
        top: calc(85px + env(safe-area-inset-top)); /* Floats cleanly beneath top control bar */
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.8rem;
        font-weight: 800;
        color: #1c1917;
        background: rgba(255, 255, 255, 0.6);
        padding: 4px 18px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        font-family: monospace; /* Preserves smooth fluid character width tracking */
        z-index: 15;
    }

    .target-array {
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        top: 55%; /* Dropped down slightly to match balance guidelines against timer element */
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .target-dot {
        background-color: #000000;
        border-radius: 50%;
        transition: opacity 0.05s ease-out;
        opacity: 1;
        flex-shrink: 0;
    }

    .target-dot.hit {
        opacity: 0;
        pointer-events: none;
    }

    .target-controls-top-hub {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top)); 
        left: 50%;
        transform: translateX(-50%);
        background: rgba(28, 25, 23, 0.95);
        color: #f5f5f4;
        padding: 12px 24px;
        border-radius: 30px;
        width: 95vw;
        max-width: 850px; 
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        transition: opacity 0.4s ease, visibility 0.4s;
        opacity: 1;
        visibility: visible;
        z-index: 30;
    }

    .target-controls-top-hub.hidden {
        opacity: 0;
        visibility: hidden;
    }

    .streak-pill-text {
        font-size: 0.9rem;
        font-weight: 700;
        color: #f5f5f4;
        white-space: nowrap;
        flex-shrink: 0;
        width: 45px; 
    }

    .slider-label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #a8a29e;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .slider-flex-container {
        flex-grow: 1; 
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 4px;
    }

    input[type="range"] {
        width: 100%;
        accent-color: #ef4444;
        margin: 0;
        padding: 8px 0;
        display: block;
    }

    .meter-container {
        width: 100%;
        height: 5px;
        background-color: #292524;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
        margin-top: 2px;
    }

    .meter-bar {
        height: 100%;
        width: 0%;
        background-color: #f43f5e;
        transition: width 0.03s linear;
    }

    .value-display {
        font-size: 0.9rem;
        font-weight: 700;
        color: #f43f5e;
        text-align: right;
        flex-shrink: 0;
        width: 32px; 
    }

    .back-arrow-btn {
        background: none;
        border: none;
        color: #f5f5f4;
        font-size: 1.6rem;
        font-weight: bold;
        cursor: pointer;
        padding: 0;
        margin: 0 0 0 5px;
        opacity: 0.6;
        transition: opacity 0.2s, transform 0.1s;
        flex-shrink: 0;
        width: 30px; 
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
    }
    .back-arrow-btn:hover { opacity: 1; }
    .back-arrow-btn:active { transform: scale(0.9); }

    .rotation-blocker {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0c0a09;
        color: #f5f5f4;
        z-index: 9999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
    }

    .phone-icon {
        width: 45px;
        height: 75px;
        border: 3px solid #f5f5f4;
        border-radius: 8px;
        margin-bottom: 20px;
        position: relative;
        animation: rotatePhone 2s ease-in-out infinite;
    }

    @keyframes rotatePhone {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(-90deg); }
        100% { transform: rotate(-90deg); }
    }

    @media screen and (orientation: portrait) {
        .setup-panel, .calibration-view, .target-view {
            display: none !important;
        }
        .rotation-blocker {
            display: flex !important;
        }
    }
</style>
<script>
    const setupPanel = document.getElementById('setupPanel');
    const calibrationView = document.getElementById('calibrationView');
    const targetView = document.getElementById('targetView');
    
    const beginBtn = document.getElementById('beginBtn');
    const calBackBtn = document.getElementById('calBackBtn');
    const startTrainingBtn = document.getElementById('startTrainingBtn');
    const backBtn = document.getElementById('backBtn');
    
    const leftwardBtn = document.getElementById('leftwardBtn');
    const rightwardBtn = document.getElementById('rightwardBtn');
    const sizeSlider = document.getElementById('sizeSlider');
    const calibrationDot = document.getElementById('calibrationDot');
    const targetArrayContainer = document.getElementById('targetArray');
    const shotTimerHud = document.getElementById('shotTimerHud');
    
    const spikeSlider = document.getElementById('spikeSlider');
    const spikeVal = document.getElementById('spikeVal');
    const deltaBar = document.getElementById('deltaBar');
    const controlHud = document.getElementById('controlHud');
    const streakCounter = document.getElementById('streakCounter');
    const welcomeStreak = document.getElementById('welcomeStreak');

    let audioCtx, analyser, highPassFilter, dataArray;
    let previousVolume = 0;
    let lastTriggerTime = 0;
    let systemInitialized = false;
    let hudTimeout;
    
    const MIN_HIT_COOLDOWN = 250; 
    const RESPAWN_DELAY = 1000;    
    const HARDCODED_FREQ = 9000; 

    let currentDirection = 'leftward'; 
    let targetIndexOrder = "5,4,3,2,1".split(","); 
    let hitPointer = 0; 
    let globalTargetSize = 45;

    // Timer Variables
    let runTimerInterval = null;
    let timerStartTime = 0;
    let isTimerRunning = false;

    function updateParameters() {
        spikeVal.innerText = spikeSlider.value;
        resetHudTimeout();
    }

    function resetHudTimeout() {
        clearTimeout(hudTimeout);
        controlHud.classList.remove('hidden');
        hudTimeout = setTimeout(() => {
            if (targetView.style.display === 'flex') {
                controlHud.classList.add('hidden');
            }
        }, 4000); 
    }

    function updateCalibrationDotSize() {
        globalTargetSize = parseInt(sizeSlider.value);
        calibrationDot.style.width = globalTargetSize + "px";
        calibrationDot.style.height = globalTargetSize + "px";
    }

    // Shot Timer execution loops
    function updateLiveTimerClock() {
        if (!isTimerRunning) return;
        const totalElapsed = (Date.now() - timerStartTime) / 1000;
        shotTimerHud.innerText = totalElapsed.toFixed(2) + "s";
        runTimerInterval = requestAnimationFrame(updateLiveTimerClock);
    }

    function stopLiveTimerClock() {
        isTimerRunning = false;
        cancelAnimationFrame(runTimerInterval);
    }

    function resetLiveTimerClock() {
        stopLiveTimerClock();
        shotTimerHud.innerText = "0.00s";
    }

    sizeSlider.addEventListener('input', updateCalibrationDotSize);
    updateCalibrationDotSize(); 

    leftwardBtn.addEventListener('click', () => {
        currentDirection = 'leftward';
        leftwardBtn.classList.add('active');
        rightwardBtn.classList.remove('active');
    });

    rightwardBtn.addEventListener('click', () => {
        currentDirection = 'rightward';
        rightwardBtn.classList.add('active');
        leftwardBtn.classList.remove('active');
    });

    spikeSlider.addEventListener('input', updateParameters);
    window.addEventListener('mousemove', resetHudTimeout);
    window.addEventListener('touchstart', resetHudTimeout);
    updateParameters();

    function checkAndRenderStreak(isNewHit = false) {
        const todayStr = new Date().toDateString();
        let storedStreak = parseInt(localStorage.getItem('df_streak_count')) || 0;
        let lastDateStr = localStorage.getItem('df_last_practice_date');

        if (!isNewHit) {
            if (lastDateStr) {
                const todayObj = new Date(todayStr);
                const lastObj = new Date(lastDateStr);
                const diffTime = Math.abs(todayObj - lastObj);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays > 1) {
                    storedStreak = 0;
                    localStorage.setItem('df_streak_count', 0);
                }
            }
            
            welcomeStreak.innerText = "🔥 " + storedStreak + " Days Practice Streak";
            streakCounter.innerText = "🔥 " + storedStreak;
            return;
        }

        if (lastDateStr !== todayStr) {
            storedStreak += 1;
            localStorage.setItem('df_streak_count', storedStreak);
            localStorage.setItem('df_last_practice_date', todayStr);
            streakCounter.innerText = "🔥 " + storedStreak;
            welcomeStreak.innerText = "🔥 " + storedStreak + " Days Practice Streak";
        }
    }

    checkAndRenderStreak();

    beginBtn.addEventListener('click', () => {
        setupPanel.style.display = 'none';
        calibrationView.style.display = 'flex';
    });

    calBackBtn.addEventListener('click', () => {
        calibrationView.style.display = 'none';
        setupPanel.style.display = 'flex';
        checkAndRenderStreak();
    });

    startTrainingBtn.addEventListener('click', async () => {
        if (currentDirection === 'leftward') {
            targetIndexOrder = "5,4,3,2,1".split(","); 
        } else {
            targetIndexOrder = "1,2,3,4,5".split(","); 
        }
        hitPointer = 0; 
        resetLiveTimerClock(); // Clear old time fields on arena entry

        targetArrayContainer.style.gap = globalTargetSize + "px"; 
        for (let i = 1; i <= 5; i++) {
            const target = document.getElementById("target" + i);
            if (target) {
                target.style.width = globalTargetSize + "px";
                target.style.height = globalTargetSize + "px";
                target.classList.remove('hit'); 
            }
        }

        if (!systemInitialized) {
            await initializeAudioSubsystem();
        }
        if (systemInitialized) {
            calibrationView.style.display = 'none';
            targetView.style.display = 'flex';
            resetHudTimeout();
        }
    });

    backBtn.addEventListener('click', () => {
        targetView.style.display = 'none';
        calibrationView.style.display = 'flex';
        clearTimeout(hudTimeout);
        controlHud.classList.remove('hidden');
        resetLiveTimerClock();
    });

    async function initializeAudioSubsystem() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            });

            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            const source = audioCtx.createMediaStreamSource(stream);

            highPassFilter = audioCtx.createBiquadFilter();
            highPassFilter.type = "highpass";
            highPassFilter.frequency.value = HARDCODED_FREQ; 

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256; 
            
            source.connect(highPassFilter);
            highPassFilter.connect(analyser);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
            systemInitialized = true;

            processAudioLoop();
        } catch (err) {
            alert('Microphone initialization failed. Please check browser configuration handles.');
        }
    }

    function processAudioLoop() {
        analyser.getByteFrequencyData(dataArray);

        let highFreqPeak = 0;
        for (let i = 0; i < dataArray.length; i++) {
            if (dataArray[i] > highFreqPeak) {
                highFreqPeak = dataArray[i];
            }
        }

        let spikeVelocity = highFreqPeak - previousVolume;
        if (spikeVelocity < 0) spikeVelocity = 0;

        const deltaPct = (spikeVelocity / 150) * 100;
        deltaBar.style.width = Math.min(deltaPct, 100) + '%';

        const now = Date.now();
        const activeThreshold = parseInt(spikeSlider.value);

        if (spikeVelocity > activeThreshold && (now - lastTriggerTime) > MIN_HIT_COOLDOWN && hitPointer < 5) {
            triggerTargetArrayHit();
            lastTriggerTime = now;
        }

        previousVolume = highFreqPeak;
        requestAnimationFrame(processAudioLoop);
    }

    function triggerTargetArrayHit() {
        // Trigger initialization of clock on your very first target strike
        if (hitPointer === 0) {
            resetLiveTimerClock();
            timerStartTime = Date.now();
            isTimerRunning = true;
            updateLiveTimerClock();
        }

        const currentTargetID = targetIndexOrder[hitPointer];
        const targetToMute = document.getElementById("target" + currentTargetID);
        
        if (targetToMute) {
            targetToMute.classList.add('hit');
            hitPointer++;
        }

        // Halt clock on final target engagement
        if (hitPointer === 5) {
            stopLiveTimerClock();
            checkAndRenderStreak(true);

            setTimeout(() => {
                for (let i = 1; i <= 5; i++) {
                    const target = document.getElementById("target" + i);
                    if (target) target.classList.remove('hit');
                }
                hitPointer = 0; 
                // Displays the score until the first target on the next run is broken
            }, RESPAWN_DELAY);
        }
    }
</script>
</body>
</html>
