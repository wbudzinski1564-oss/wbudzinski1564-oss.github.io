<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mic Volume Color Flash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212;
            color: #ffffff;
            transition: background-color 0.1s ease;
        }
        .controls-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .slider-container {
            margin: 20px 0;
        }
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        .metrics {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }
        .highlight {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="controls-card">
        <h2>Mic Color Trigger</h2>
        <button id="startButton">Start Microphone</button>
        
        <div class="slider-container">
            <label for="thresholdSlider">Volume Threshold: <span id="thresholdVal" class="highlight">-40</span> dB</label>
            <input type="range" id="thresholdSlider" min="-100" max="0" value="-40" step="1">
        </div>

        <div class="metrics">
            <p>Current Mic Volume: <span id="currentVolume">-100</span> dB</p>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdVal = document.getElementById('thresholdVal');
        const currentVolumeLabel = document.getElementById('currentVolume');
        const body = document.body;

        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        let isFlashing = false;
        let flashTimeout;

        // Colors to cycle through on each flash
        const flashColors = ['#ff0055', '#00ffcc', '#ffcc00', '#9900ff', '#00ff66'];

        thresholdSlider.addEventListener('input', (e) => {
            thresholdVal.textContent = e.target.value;
        });

        startButton.addEventListener('click', async () => {
            if (audioContext) return; // Already running

            try {
                // Request mic access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // Initialize Web Audio API
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                analyser.fftSize = 256;
                microphone.connect(analyser);

                startButton.textContent = "Mic Active";
                startButton.disabled = true;
                startButton.style.backgroundColor = "#28a745";

                monitorVolume();
            } catch (err) {
                alert('Microphone access denied or unsupported by browser: ' + err.message);
            }
        });

        function monitorVolume() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Float32Array(bufferLength);

            function update() {
                analyser.getFloatTimeDomainData(dataArray);

                // Calculate Root Mean Square (RMS) volume
                let sumSquares = 0.0;
                for (const amplitude of dataArray) {
                    sumSquares += amplitude * amplitude;
                }
                let rms = Math.sqrt(sumSquares / dataArray.length);

                // Convert RMS to Decibels (dB)
                let db = 20 * Math.log10(rms);
                
                // Handle silence (negative infinity)
                if (!isFinite(db)) db = -100; 

                // Round for clean UI display
                const roundedDb = Math.round(db);
                currentVolumeLabel.textContent = roundedDb;

                // Check threshold trigger
                const threshold = parseInt(thresholdSlider.value);
                if (roundedDb >= threshold && !isFlashing) {
                    triggerFlash();
                }

                requestAnimationFrame(update);
            }

            requestAnimationFrame(update);
        }

        function triggerFlash() {
            isFlashing = true;
            
            // Pick a random flash color
            const randomColor = flashColors[Math.floor(Math.random() * flashColors.length)];
            body.style.backgroundColor = randomColor;

            // Reset background back to dark after exactly 1 second (1000ms)
            flashTimeout = setTimeout(() => {
                body.style.backgroundColor = '#121212';
                
                // Slight cooldown before allowing next flash to avoid instant re-triggering
                setTimeout(() => {
                    isFlashing = false;
                }, 200); 
            }, 1000);
        }
    </script>
</body>
</html>
