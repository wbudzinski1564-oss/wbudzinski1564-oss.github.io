<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Dot</title>
    <style>
        /* Force the website to be completely full screen with no scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set initial canvas size to fill the screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Dot properties
        let radius = 15;
        let x = canvas.width / 2;
        let y = canvas.height / 2;
        let dx = 4; // Horizontal speed
        let dy = 4; // Vertical speed

        // Animation Loop
        function animate() {
            // 1. Clear the screen to pure white every frame
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw the black dot
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff000';
            ctx.fill();
            ctx.closePath();

            // 3. Bounce off the left or right screen edges
            if (x + dx > canvas.width - radius || x + dx < radius) {
                dx = -dx;
            }
            // 4. Bounce off the top or bottom screen edges
            if (y + dy > canvas.height - radius || y + dy < radius) {
                dy = -dy;
            }

            // 5. Move the dot
            x += dx;
            y += dy;

            // Keep the loop running smoothly
            requestAnimationFrame(animate);
        }

        // Start the animation
        animate();
    </script>
</body>
</html>
