<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dry Fire</title>
    <style>
        /* Force edge-to-edge canvas space */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        
        /* Fixed lopsided display scaling layout */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
        }

        /* Menu Interface Layout cards */
        #mainMenu, #gameOverMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 10;
        }

        #gameOverMenu {
            display: none;
        }

        h1 {
            font-size: 3rem;
            color: #000000;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .play-btn {
            padding: 15px 40px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #000000;
            border: 2px solid #000000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Top HUD Timer Placement */
        #timerHUD {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #000000;
            font-family: monospace;
            z-index: 5;
            display: none;
        }

        /* Responsive Mobile Sideways Instruction Lockout */
        #orientationWarning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #orientationWarning p {
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            margin-top: 15px;
        }

        /* Display prompt if phone viewport turns upright vertical */
        @media (orientation: portrait) {
            #orientationWarning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="orientationWarning">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg>
        <p>Please rotate your device sideways to play!</p>
    </div>

    <div id="mainMenu">
        <h1>Dry Fire</h1>
        <button class="play-btn" onclick="startGame()">Play</button>
    </div>

    <div id="gameOverMenu">
        <h1>Time's Up!</h1>
        <button class="play-btn" onclick="returnToMenu()">Main Menu</button>
    </div>

    <div id="timerHUD">1:00</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('mainMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const timerHUD = document.getElementById('timerHUD');

        let animationFrameId;
        let countdownInterval;
        let timeLeft = 60;
        let isPlaying = false;

        // Target Configuration: 11.5mm diameter translates to a precise 21.73 pixel radius
        const radius = 21.73;
        let x, y;
        
        // Speed parameters reduced significantly below 1 for a very slow pace
        let dx = 0.8; 
        let dy = 0.8; 

        // Fixes screen-boundary calculations on mobile rotation switches
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Keep the target dot inside bounds if the screen size drops suddenly
            if (isPlaying) {
                if (x > canvas.width - radius) x = canvas.width - radius;
                if (x < radius) x = radius;
                if (y > canvas.height - radius) y = canvas.height - radius;
                if (y < radius) y = radius;
            }
        }
        window.addEventListener('resize', () => {
            setTimeout(resizeCanvas, 100); // Small timeout allows mobile frames to settle
        });

        // Core Physics loop
        function animate() {
            if (!isPlaying) return;

            // Clear framework panel cleanly
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render exact 11.5mm physical circular target
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            ctx.closePath();

            // Right/Left side wall bounding checks
            if (x + dx > canvas.width - radius || x + dx < radius) {
                dx = -dx;
            }
            // Top/Bottom side wall bounding checks
            if (y + dy > canvas.height - radius || y + dy < radius) {
                dy = -dy;
            }

            // Incremental positional adjustments
            x += dx;
            y += dy;

            animationFrameId = requestAnimationFrame(animate);
        }

        function startTimer() {
            timeLeft = 60;
            updateTimerDisplay();
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerHUD.textContent = `${minutes}:${seconds}`;
        }

        function startGame() {
            isPlaying = true;
            mainMenu.style.display = 'none';
            gameOverMenu.style.display = 'none';
            
            canvas.style.display = 'block';
            timerHUD.style.display = 'block';
            
            resizeCanvas();

            // Spawn target directly dead-center of landscape display grid
            x = canvas.width / 2;
            y = canvas.height / 2;

            startTimer();
            animate();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(countdownInterval);
            cancelAnimationFrame(animationFrameId);
            
            canvas.style.display = 'none';
            timerHUD.style.display = 'none';
            gameOverMenu.style.display = 'flex';
        }

        function returnToMenu() {
            gameOverMenu.style.display = 'none';
            mainMenu.style.display = 'flex';
        }
    </script>
</body>
</html>
