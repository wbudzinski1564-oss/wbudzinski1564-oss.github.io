<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dry Fire</title>
    <style>
        /* Force edge-to-edge canvas space */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        
        /* Fixed display scaling layout */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
        }

        /* Menu Interface Layout cards */
        #mainMenu, #gameOverMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 10;
        }

        #gameOverMenu {
            display: none;
        }

        h1 {
            font-size: 3rem;
            color: #000000;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .play-btn {
            padding: 15px 40px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #000000;
            border: 2px solid #000000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Top HUD Timer Placement */
        #timerHUD {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #000000;
            font-family: monospace;
            z-index: 5;
            display: none;
        }

        /* Responsive Mobile Sideways Instruction Lockout */
        #orientationWarning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #orientationWarning p {
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            margin-top: 15px;
        }

        /* Display prompt if phone viewport turns upright vertical */
        @media (orientation: portrait) {
            #orientationWarning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="orientationWarning">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg>
        <p>Please rotate your device sideways to play!</p>
    </div>

    <div id="mainMenu">
        <h1>Dry Fire</h1>
        <button class="play-btn" onclick="startGame()">Play</button>
    </div>

    <div id="gameOverMenu">
        <h1>Drill Complete!</h1>
        <button class="play-btn" onclick="returnToMenu()">Main Menu</button>
    </div>

    <div id="timerHUD">1:00</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('mainMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const timerHUD = document.getElementById('timerHUD');

        let animationFrameId;
        let countdownInterval;
        let timeLeft = 60;
        let gameState = 'menu'; // 'menu', 'phase1', 'phase2', 'gameover'

        // Target Configuration: 11.5mm diameter translates to a precise 21.73 pixel radius
        const radius = 21.73;
        const diameter = radius * 2;
        let x, y;
        
        // Slower movement speed configuration
        let dx = 0.8; 
        let dy = 0.8; 

        // Phase 2 State Variables
        let activeDotIndex = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            if (gameState === 'phase1') {
                if (x > canvas.width - radius) x = canvas.width - radius;
                if (x < radius) x = radius;
                if (y > canvas.height - radius) y = canvas.height - radius;
                if (y < radius) y = radius;
            }
        }
        
        window.addEventListener('resize', () => {
            setTimeout(resizeCanvas, 150); 
        });

        // Core Rendering and Update Loop
        function animate() {
            if (gameState !== 'phase1' && gameState !== 'phase2') return;

            // Clear framework screen cleanly
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'phase1') {
                // PHASE 1: Render moving target dot
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
                ctx.closePath();

                // Wall bounce physics vectors
                if (x + dx > canvas.width - radius || x + dx < radius) {
                    dx = -dx;
                }
                if (y + dy > canvas.height - radius || y + dy < radius) {
                    dy = -dy;
                }

                x += dx;
                y += dy;

            } else if (gameState === 'phase2') {
                // PHASE 2: 5 horizontal dots with 1-dot-width spacing between them
                // Total width calculation: 5 diameters + 4 diameter spacings = 9 diameters total
                const totalGridWidth = diameter * 9;
                const startX = (canvas.width - totalGridWidth) / 2 + radius;
                const centerY = canvas.height / 2;

                for (let i = 0; i < 5; i++) {
                    // Spacing step calculation: Move by 2 diameters per index position
                    const dotX = startX + (i * diameter * 2);

                    ctx.beginPath();
                    ctx.arc(dotX, centerY, radius, 0, Math.PI * 2);
                    
                    if (i === activeDotIndex) {
                        ctx.fillStyle = '#000000';
                        ctx.fill();
                    } else {
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.closePath();
                }
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        // Central Countdown Management Clock
        function startTimer() {
            updateTimerDisplay();
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                // Phase 2 Target update rule: choose a new random index every 5 seconds
                if (gameState === 'phase2' && timeLeft % 5 === 0 && timeLeft > 0) {
                    chooseRandomDot();
                }

                if (timeLeft <= 0) {
                    if (gameState === 'phase1') {
                        switchToPhase2();
                    } else if (gameState === 'phase2') {
                        endGame();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerHUD.textContent = `${minutes}:${seconds}`;
        }

        function chooseRandomDot() {
            let nextIndex;
            // Prevent picking the exact same target back-to-back
            do {
                nextIndex = Math.floor(Math.random() * 5);
            } while (nextIndex === activeDotIndex);
            
            activeDotIndex = nextIndex;
        }

        function startGame() {
            gameState = 'phase1';
            timeLeft = 60;

            mainMenu.style.display = 'none';
            gameOverMenu.style.display = 'none';
            canvas.style.display = 'block';
            timerHUD.style.display = 'block';
            
            resizeCanvas();

            // Setup moving dot initial positions
            x = window.innerWidth / 2;
            y = window.innerHeight / 2;

            startTimer();
            animate();
        }

        function switchToPhase2() {
            gameState = 'phase2';
            timeLeft = 60; // Reset countdown for Phase 2 sequence
            updateTimerDisplay();
            chooseRandomDot(); // Select first active blinking dot target layout
        }

        function endGame() {
            gameState = 'gameover';
            clearInterval(countdownInterval);
            cancelAnimationFrame(animationFrameId);
            
            canvas.style.display = 'none';
            timerHUD.style.display = 'none';
            gameOverMenu.style.display = 'flex';
        }

        function returnToMenu() {
            gameState = 'menu';
            gameOverMenu.style.display = 'none';
            mainMenu.style.display = 'flex';
        }
