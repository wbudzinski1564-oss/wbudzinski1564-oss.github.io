<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Detector</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.1s ease-out;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background-color: #00ff88;
            color: #000000;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #00e67a;
        }

        button:active {
            transform: scale(0.95);
        }

        .status {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #aaaaaa;
        }

        /* Flash class applied to body via JS */
        body.flash {
            background-color: #ff0055;
            transition: none; /* Instant bright flash */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Snap & Clap Detector</h1>
        <p>Click the button below to start monitoring your microphone.</p>
        <button id="startButton">Start Listening</button>
        <div id="status" class="status">Microphone: Idle</div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        
        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        
        // Configuration thresholds
        const SNAP_THRESHOLD = 45; // How loud the sound must be (0-255)
        const COOLDOWN_TIME = 300; // Milliseconds to wait before detecting the next snap
        let lastTriggerTime = 0;

        startButton.addEventListener('click', async () => {
            // Browser security requires a user gesture to start audio
            if (audioContext) return; 

            try {
                // 1. Request microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                statusText.innerText = "Microphone: Listening...";
                startButton.style.display = 'none';

                // 2. Set up Web Audio API pipeline
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; // Small buffer for fast, real-time responses

                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);

                // 3. Monitor audio frames continuously
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                function checkAudio() {
                    analyser.getByteFrequencyData(dataArray);

                    // Find the loudest frequency in the current frame
                    let maxVolume = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        if (dataArray[i] > maxVolume) {
                            maxVolume = dataArray[i];
                        }
                    }

                    // 4. Threshold and cooldown logic
                    const currentTime = Date.now();
                    if (maxVolume > SNAP_THRESHOLD && (currentTime - lastTriggerTime) > COOLDOWN_TIME) {
                        triggerAction();
                        lastTriggerTime = currentTime;
                    }

                    requestAnimationFrame(checkAudio);
                }

                checkAudio();

            } catch (err) {
                console.error('Error accessing microphone:', err);
                statusText.innerText = "Error: Microphone access denied.";
                statusText.style.color = "#ff4444";
            }
        });

        // 5. The "Something" that happens
        function triggerAction() {
            // Add flash class to instantly change background
            document.body.classList.add('flash');
            
            // Remove it shortly after to create a pulse effect
            setTimeout(() => {
                document.body.classList.remove('flash');
            }, 100);
        }
    </script>
</body>
</html>
