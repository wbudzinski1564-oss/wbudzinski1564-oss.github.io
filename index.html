<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dry Fire</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f4; 
            color: #1c1917;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Centering Overhaul for Setup Panel */
        .setup-panel {
            background: #1c1917;
            color: #f5f5f4;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid #2e2a24;
            width: 85vw;
            max-width: 400px;
            z-index: 100;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Perfect absolute geometric center */
        }

        button {
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background-color: #ef4444;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            width: 100%;
            margin-top: 15px;
        }

        button:hover { background-color: #dc2626; }
        button:active { transform: scale(0.98); }

        /* Centering Overhaul for Live Target View Screen */
        .target-view {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        /* 1/2 Size Target Dot (45px) perfectly dead-centered */
        .target-dot {
            width: 45px;
            height: 45px;
            background-color: #000000;
            border-radius: 50%;
            transition: opacity 0.05s ease-out;
            opacity: 1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Absolute pinpoint center */
        }

        .target-dot.hit {
            opacity: 0;
            pointer-events: none;
        }

        /* Target HUD Controls (Moved Slider here) */
        .target-controls {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom)); /* Respects iPhone home indicator bar */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 25, 23, 0.9);
            color: #f5f5f4;
            padding: 12px 20px;
            border-radius: 30px;
            width: 80vw;
            max-width: 450px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        .slider-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a8a29e;
            white-space: nowrap;
        }

        .slider-container-wrapper {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #ef4444;
            margin: 0;
        }

        .meter-container {
            width: 100%;
            height: 4px;
            background-color: #292524;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-top: 4px;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            background-color: #f43f5e;
            transition: width 0.03s linear;
        }

        .threshold-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ffffff;
            box-shadow: 0 0 4px #fff;
        }

        .value-display {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f43f5e;
            min-width: 25px;
            text-align: right;
        }

        /* Layout Back Navigation Gear button */
        .gear-btn {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: max(15px, env(safe-area-inset-right));
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            width: auto;
            margin: 0;
            padding: 5px;
            opacity: 0.3;
            z-index: 20;
        }
        .gear-btn:hover { opacity: 0.8; }

        /* Orientation Enforcement Blocker Overlay */
        .rotation-blocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0c0a09;
            color: #f5f5f4;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .phone-icon {
            width: 45px;
            height: 75px;
            border: 3px solid #f5f5f4;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        @media screen and (orientation: portrait) {
            .setup-panel, .target-view {
                display: none !important;
            }
            .rotation-blocker {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <div class="rotation-blocker">
        <div class="phone-icon"></div>
        <h3 style="margin: 0 0 8px 0; font-size: 1.3rem;">Please Rotate Device</h3>
        <p style="color: #a8a29e; font-size: 0.9rem; max-width: 260px; margin: 0;">Dry Fire requires Landscape Mode to optimize target presentation layout.</p>
    </div>

    <!-- First Page (Clean initialization page without slider) -->
    <div id="setupPanel" class="setup-panel">
        <h2 style="margin:0 0 4px 0; font-size: 1.8rem; letter-spacing: -0.02em;">Dry Fire</h2>
        <p style="color:#a8a29e; font-size:0.85rem; margin:0 0 10px 0;">Tap begin to launch the training center target frame.</p>
        <button id="beginBtn">Begin</button>
    </div>

    <!-- Active Practice Arena (Now contains the calibration slider layout) -->
    <div id="targetView" class="target-view">
        <button id="gearBtn" class="gear-btn">⚙️</button>
        
        <div id="targetDot" class="target-dot"></div>

        <div class="target-controls">
            <span class="slider-label">Sens</span>
            <div class="slider-container-wrapper">
                <input type="range" id="spikeSlider" min="20" max="150" value="90">
                <div class="meter-container">
                    <div id="deltaBar" class="meter-bar"></div>
                    <div id="deltaThresholdLine" class="threshold-line"></div>
                </div>
            </div>
            <span id="spikeVal" class="value-display">90</span>
        </div>
    </div>
    <script>
        const setupPanel = document.getElementById('setupPanel');
        const targetView = document.getElementById('targetView');
        const beginBtn = document.getElementById('beginBtn');
        const gearBtn = document.getElementById('gearBtn');
        const targetDot = document.getElementById('targetDot');
        
        const spikeSlider = document.getElementById('spikeSlider');
        const spikeVal = document.getElementById('spikeVal');
        const deltaBar = document.getElementById('deltaBar');
        const deltaThresholdLine = document.getElementById('deltaThresholdLine');

        let audioCtx, analyser, highPassFilter, dataArray;
        let previousVolume = 0;
        let lastTriggerTime = 0;
        let systemInitialized = false;
        
        const RESPAWN_DELAY = 2000; 
        const HARDCODED_FREQ = 9000; 

        function updateParameters() {
            spikeVal.innerText = spikeSlider.value;
            const pct = (spikeSlider.value / 150) * 100;
            deltaThresholdLine.style.left = pct + "%";
        }

        spikeSlider.addEventListener('input', updateParameters);
        updateParameters();

        beginBtn.addEventListener('click', async () => {
            if (!systemInitialized) {
                await initializeAudioSubsystem();
            }
            if (systemInitialized) {
                setupPanel.style.display = 'none';
                targetView.style.display = 'block';
            }
        });

        gearBtn.addEventListener('click', () => {
            targetView.style.display = 'none';
            setupPanel.style.display = 'block';
        });

        async function initializeAudioSubsystem() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false, 
                        autoGainControl: false
                    } 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                const source = audioCtx.createMediaStreamSource(stream);

                highPassFilter = audioCtx.createBiquadFilter();
                highPassFilter.type = "highpass";
                highPassFilter.frequency.value = HARDCODED_FREQ; 

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; 
                
                source.connect(highPassFilter);
                highPassFilter.connect(analyser);

                dataArray = new Uint8Array(analyser.frequencyBinCount);
                systemInitialized = true;

                processAudioLoop();
            } catch (err) {
                alert('Microphone access denied. Please verify Safari browser app configuration parameters.');
            }
        }

        function processAudioLoop() {
            analyser.getByteFrequencyData(dataArray);

            let highFreqPeak = 0;
            for (let i = 0; i < dataArray.length; i++) {
                if (dataArray[i] > highFreqPeak) {
                    highFreqPeak = dataArray[i];
                }
            }

            let spikeVelocity = highFreqPeak - previousVolume;
            if (spikeVelocity < 0) spikeVelocity = 0;

            // Continually populate telemetry calibration stats onto the target HUD bar
            const deltaPct = (spikeVelocity / 150) * 100;
            deltaBar.style.width = Math.min(deltaPct, 100) + '%';

            const now = Date.now();
            const activeThreshold = parseInt(spikeSlider.value);

            if (spikeVelocity > activeThreshold && (now - lastTriggerTime) > RESPAWN_DELAY) {
                triggerTargetHit();
                lastTriggerTime = now;
            }

            previousVolume = highFreqPeak;
            requestAnimationFrame(processAudioLoop);
        }

        function triggerTargetHit() {
            targetDot.classList.add('hit');
            setTimeout(() => {
                targetDot.classList.remove('hit');
            }, RESPAWN_DELAY);
        }
    </script>
</body>
</html>
