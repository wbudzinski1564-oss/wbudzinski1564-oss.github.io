<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dry Fire</title>
</head>
<body>

    <!-- Orientation Blocker -->
    <div class="rotation-blocker">
        <div class="phone-icon"></div>
        <h3>Please Rotate Device</h3>
        <p>Dry Fire requires Landscape Mode to optimize target presentation layout.</p>
    </div>

    <!-- Screen 1: Main Menu -->
    <div id="setupPanel" class="page-layer setup-panel">
        <div class="setup-content">
            <h2 style="font-size: 2.5rem; margin: 0 0 10px 0;">Dry Fire</h2>
            <div id="welcomeStreak" class="main-streak-badge">🔥 0 Days Practice Streak</div>
            
            <!-- CHANGED: Replaced header string and shortened parameters -->
            <span class="selector-label" style="margin-top: 20px;">Shooting Direction</span>
            <div class="segmented-control">
                <button type="button" id="leftwardBtn" class="segment-btn active">Left</button>
                <button type="button" id="rightwardBtn" class="segment-btn">Right</button>
            </div>
            <button id="beginBtn" class="action-btn">Begin</button>
        </div>
    </div>

    <!-- Screen 2: Size Calibration -->
    <div id="calibrationView" class="page-layer calibration-view">
        <div class="calibration-controls">
            <span class="slider-label" style="color: #f5f5f4;">Adjust Target Size</span>
            <input type="range" id="sizeSlider" min="15" max="120" value="45">
            <button id="startTrainingBtn" class="action-btn" style="margin:0; padding:10px 20px; font-size:1rem; width:auto;">Start Training</button>
            <button id="calBackBtn" class="back-arrow-btn">↩</button>
        </div>
        <div id="calibrationDot" class="target-dot"></div>
    </div>

    <!-- Screen 3: Practice Arena -->
    <div id="targetView" class="page-layer target-view">
        <div id="controlHud" class="target-controls-top-hub">
            <div id="streakCounter" class="streak-pill-text">🔥 0</div>
            <div class="slider-label">Sensitivity:</div>
            <div class="slider-flex-container">
                <input type="range" id="spikeSlider" min="20" max="150" value="90">
                <div class="meter-container"><div id="deltaBar" class="meter-bar"></div></div>
            </div>
            <span id="spikeVal" class="value-display">90</span>
            <button id="backBtn" class="back-arrow-btn">↩</button>
        </div>
        
        <!-- CHANGED: Removed the 's' text from layout frame -->
        <div id="shotTimerHud" class="shot-timer-hud">0.00</div>
        
        <div id="targetArray" class="target-array">
            <div class="target-dot" id="target1"></div>
            <div class="target-dot" id="target2"></div>
            <div class="target-dot" id="target3"></div>
            <div class="target-dot" id="target4"></div>
            <div class="target-dot" id="target5"></div>
        </div>
    </div>
<style>
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body {
        margin: 0; padding: 0; width: 100vw; height: 100dvh; min-height: -webkit-fill-available;
        background-color: #f5f5f4; color: #1c1917; font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden; position: relative;
    }
    .page-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    .setup-panel { background: #1c1917; color: #f5f5f4; width: 100%; height: 100%; padding: 40px; text-align: center; z-index: 100; flex-direction: column; }
    .setup-content { max-width: 440px; width: 100%; margin: auto; }
    .main-streak-badge { font-size: 1.2rem; font-weight: 700; color: #f43f5e; background: #141210; padding: 12px 24px; border-radius: 50px; display: inline-block; border: 1px solid #2e2a24; margin: 10px 0; }
    .selector-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #a8a29e; margin-bottom: 10px; display: block; }
    .segmented-control { display: flex; background: #141210; padding: 4px; border-radius: 12px; border: 1px solid #2e2a24; margin-bottom: 25px; }
    .segment-btn { flex: 1; padding: 10px; font-size: 0.95rem; font-weight: 600; background: transparent; color: #a8a29e; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
    .segment-btn.active { background-color: #ef4444; color: #ffffff; }
    .action-btn { padding: 16px 32px; font-size: 1.3rem; font-weight: 700; border: none; border-radius: 12px; background-color: #ef4444; color: white; cursor: pointer; width: 100%; }
    .calibration-view { display: none; z-index: 50; }
    .calibration-controls { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(28, 25, 23, 0.95); padding: 12px 24px; border-radius: 30px; display: flex; align-items: center; gap: 20px; width: 95vw; max-width: 750px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(10px); }
    .calibration-controls input[type="range"] { flex-grow: 1; accent-color: #ef4444; background: transparent; }
    .target-view { display: none; z-index: 10; }
    .shot-timer-hud {
        position: absolute; top: calc(85px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
        font-size: 1.8rem; font-weight: 800; color: #1c1917; background: rgba(255, 255, 255, 0.6);
        padding: 4px 18px; border-radius: 12px; border: 1px solid rgba(0, 0, 0, 0.05); font-family: monospace; z-index: 15;
        transition: color 0.15s ease;
    }
    /* Dynamic success indicator modification utility string */
    .shot-timer-hud.finished { color: #22c55e !important; }
    .target-array { display: flex; justify-content: center; align-items: center; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); }
    .target-dot { background-color: #000000; border-radius: 50%; transition: opacity 0.05s ease-out; opacity: 1; flex-shrink: 0; }
    .target-dot.hit { opacity: 0; pointer-events: none; }
    .target-controls-top-hub { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(28, 25, 23, 0.95); color: #f5f5f4; padding: 12px 24px; border-radius: 30px; width: 95vw; max-width: 850px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(10px); transition: opacity 0.4s ease, visibility 0.4s; opacity: 1; z-index: 30; }
    .target-controls-top-hub.hidden { opacity: 0; visibility: hidden; }
    .streak-pill-text { font-size: 0.9rem; font-weight: 700; color: #f5f5f4; white-space: nowrap; flex-shrink: 0; width: 45px; }
    .slider-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #a8a29e; white-space: nowrap; flex-shrink: 0; }
    .slider-flex-container { flex-grow: 1; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 4px; }
    input[type="range"] { width: 100%; accent-color: #ef4444; margin: 0; padding: 8px 0; display: block; }
    .meter-container { width: 100%; height: 5px; background-color: #292524; border-radius: 2px; overflow: hidden; position: relative; margin-top: 2px; }
    .meter-bar { height: 100%; width: 0%; background-color: #f43f5e; transition: width 0.03s linear; }
    .value-display { font-size: 0.9rem; font-weight: 700; color: #f43f5e; text-align: right; flex-shrink: 0; width: 32px; }
    .back-arrow-btn { background: none; border: none; color: #f5f5f4; font-size: 1.6rem; font-weight: bold; cursor: pointer; padding: 0; margin: 0 0 0 5px; opacity: 0.6; transition: opacity 0.2s; flex-shrink: 0; width: 30px; display: flex; align-items: center; justify-content: center; }
    .back-arrow-btn:hover { opacity: 1; }
    .rotation-blocker { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #0c0a09; color: #f5f5f4; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    .phone-icon { width: 45px; height: 75px; border: 3px solid #f5f5f4; border-radius: 8px; margin-bottom: 20px; position: relative; animation: rotatePhone 2s ease-in-out infinite; }
    @keyframes rotatePhone { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
    @media screen and (orientation: portrait) { .setup-panel, .calibration-view, .target-view { display: none !important; } .rotation-blocker { display: flex !important; } }
</style>
<script>
    const setupPanel = document.getElementById('setupPanel');
    const calibrationView = document.getElementById('calibrationView');
    const targetView = document.getElementById('targetView');
    const beginBtn = document.getElementById('beginBtn');
    const calBackBtn = document.getElementById('calBackBtn');
    const startTrainingBtn = document.getElementById('startTrainingBtn');
    const backBtn = document.getElementById('backBtn');
    const leftwardBtn = document.getElementById('leftwardBtn');
    const rightwardBtn = document.getElementById('rightwardBtn');
    const sizeSlider = document.getElementById('sizeSlider');
    const calibrationDot = document.getElementById('calibrationDot');
    const targetArrayContainer = document.getElementById('targetArray');
    const shotTimerHud = document.getElementById('shotTimerHud');
    const spikeSlider = document.getElementById('spikeSlider');
    const spikeVal = document.getElementById('spikeVal');
    const deltaBar = document.getElementById('deltaBar');
    const controlHud = document.getElementById('controlHud');
    const streakCounter = document.getElementById('streakCounter');
    const welcomeStreak = document.getElementById('welcomeStreak');

    let audioCtx, analyser, highPassFilter, dataArray;
    let previousVolume = 0, lastTriggerTime = 0, systemInitialized = false, hudTimeout;
    const MIN_HIT_COOLDOWN = 250, RESPAWN_DELAY = 1000, HARDCODED_FREQ = 9000; 

    let currentDirection = 'leftward', targetIndexOrder = "5,4,3,2,1".split(","), hitPointer = 0, globalTargetSize = 45;
    let runTimerInterval = null, timerStartTime = 0, isTimerRunning = false;

    function updateParameters() { spikeVal.innerText = spikeSlider.value; resetHudTimeout(); }
    function resetHudTimeout() {
        clearTimeout(hudTimeout); controlHud.classList.remove('hidden');
        hudTimeout = setTimeout(() => { if (targetView.style.display === 'flex') controlHud.classList.add('hidden'); }, 4000);
    }
    function updateCalibrationDotSize() {
        globalTargetSize = parseInt(sizeSlider.value);
        calibrationDot.style.width = globalTargetSize + "px"; calibrationDot.style.height = globalTargetSize + "px";
    }
    function updateLiveTimerClock() {
        if (!isTimerRunning) return;
        shotTimerHud.innerText = ((Date.now() - timerStartTime) / 1000).toFixed(2);
        runTimerInterval = requestAnimationFrame(updateLiveTimerClock);
    }
    function resetLiveTimerClock() {
        isTimerRunning = false; cancelAnimationFrame(runTimerInterval);
        shotTimerHud.classList.remove('finished'); // Reset color state
        shotTimerHud.innerText = "0.00";
    }

    sizeSlider.addEventListener('input', updateCalibrationDotSize);
    updateCalibrationDotSize();

    leftwardBtn.addEventListener('click', () => { currentDirection = 'leftward'; leftwardBtn.classList.add('active'); rightwardBtn.classList.remove('active'); });
    rightwardBtn.addEventListener('click', () => { currentDirection = 'rightward'; rightwardBtn.classList.add('active'); leftwardBtn.classList.remove('active'); });
    spikeSlider.addEventListener('input', updateParameters);
    window.addEventListener('mousemove', resetHudTimeout); window.addEventListener('touchstart', resetHudTimeout);
    updateParameters();

    function checkAndRenderStreak(isNewHit = false) {
        const todayStr = new Date().toDateString();
        let storedStreak = parseInt(localStorage.getItem('df_streak_count')) || 0;
        let lastDateStr = localStorage.getItem('df_last_practice_date');
        if (!isNewHit && lastDateStr && Math.ceil(Math.abs(new Date(todayStr) - new Date(lastDateStr)) / 86400000) > 1) {
            storedStreak = 0; localStorage.setItem('df_streak_count', 0);
        }
        if (isNewHit && lastDateStr !== todayStr) {
            storedStreak += 1; localStorage.setItem('df_streak_count', storedStreak); localStorage.setItem('df_last_practice_date', todayStr);
        }
        welcomeStreak.innerText = `🔥 ${storedStreak} Days Practice Streak`;
        streakCounter.innerText = `🔥 ${storedStreak}`;
    }
    checkAndRenderStreak();

    // CLOSED NAVIGATION LOOPS: Clean route back to main screen dashboard menu profiles
    function navigateToHomeScreen() {
        targetView.style.display = 'none'; calibrationView.style.display = 'none';
        setupPanel.style.display = 'flex';
        resetLiveTimerClock();
        clearTimeout(hudTimeout); controlHud.classList.remove('hidden');
        checkAndRenderStreak();
    }

    beginBtn.addEventListener('click', () => { setupPanel.style.display = 'none'; calibrationView.style.display = 'flex'; });
    calBackBtn.addEventListener('click', navigateToHomeScreen);
    backBtn.addEventListener('click', navigateToHomeScreen);

    startTrainingBtn.addEventListener('click', async () => {
        targetIndexOrder = (currentDirection === 'leftward') ? "5,4,3,2,1".split(",") : "1,2,3,4,5".split(",");
        hitPointer = 0; resetLiveTimerClock();
        targetArrayContainer.style.gap = globalTargetSize + "px";
        for (let i = 1; i <= 5; i++) {
            const t = document.getElementById("target" + i);
            if (t) { t.style.width = globalTargetSize + "px"; t.style.height = globalTargetSize + "px"; t.classList.remove('hit'); }
        }
        if (!systemInitialized) await initializeAudioSubsystem();
        if (systemInitialized) { calibrationView.style.display = 'none'; targetView.style.display = 'flex'; resetHudTimeout(); }
    });

    async function initializeAudioSubsystem() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            const source = audioCtx.createMediaStreamSource(stream);
            highPassFilter = audioCtx.createBiquadFilter(); highPassFilter.type = "highpass"; highPassFilter.frequency.value = HARDCODED_FREQ;
            analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
            source.connect(highPassFilter); highPassFilter.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount); systemInitialized = true; processAudioLoop();
        } catch (err) { alert('Microphone access tracking failed.'); }
    }

    function processAudioLoop() {
        analyser.getByteFrequencyData(dataArray);
        let highFreqPeak = 0;
        for (let i = 0; i < dataArray.length; i++) { if (dataArray[i] > highFreqPeak) highFreqPeak = dataArray[i]; }
        let spikeVelocity = Math.max(0, highFreqPeak - previousVolume);
        deltaBar.style.width = Math.min((spikeVelocity / 150) * 100, 100) + '%';
        const now = Date.now();
        if (spikeVelocity > parseInt(spikeSlider.value) && (now - lastTriggerTime) > MIN_HIT_COOLDOWN && hitPointer < 5) {
            triggerTargetArrayHit(); lastTriggerTime = now;
        }
        previousVolume = highFreqPeak; requestAnimationFrame(processAudioLoop);
    }

    function triggerTargetArrayHit() {
        if (hitPointer === 0) { resetLiveTimerClock(); timerStartTime = Date.now(); isTimerRunning = true; updateLiveTimerClock(); }
        const t = document.getElementById("target" + targetIndexOrder[hitPointer]);
        if (t) { t.classList.add('hit'); hitPointer++; }
        
        // CHANGED: Added success color marker trigger node
        if (hitPointer === 5) {
            isTimerRunning = false; cancelAnimationFrame(runTimerInterval);
            shotTimerHud.classList.add('finished'); // Turns the timer green
            checkAndRenderStreak(true);
            setTimeout(() => {
                for (let i = 1; i <= 5; i++) { const target = document.getElementById("target" + i); if (target) target.classList.remove('hit'); }
                hitPointer = 0;
            }, RESPAWN_DELAY);
        }
    }
</script>
</body>
</html>
