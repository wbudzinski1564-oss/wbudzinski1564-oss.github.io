<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifle Click Detector</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121214;
            color: #e4e4e7;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.1s ease-out;
        }

        .container {
            text-align: center;
            background: #1c1c1f;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2d2d30;
            width: 340px;
        }

        button {
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background-color: #3b82f6;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            width: 100%;
        }

        button:hover { background-color: #2563eb; }
        button:active { transform: scale(0.98); }

        .dashboard {
            display: none;
            margin-top: 24px;
            text-align: left;
        }

        .metric {
            background: #111113;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #27272a;
        }

        .metric-title {
            font-size: 0.8rem;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 4px;
        }

        .status {
            text-align: center;
            color: #22c55e;
            font-weight: 600;
            margin-top: 16px;
            font-size: 0.95rem;
        }

        body.shot-detected {
            background-color: #22c55e;
            transition: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-top:0; font-size: 1.6rem; letter-spacing: -0.02em;">Rifle Click Detector</h2>
        <p style="color:#a1a1aa; font-size:0.9rem; margin-bottom:24px;">Filters out reload mechanical noises. Optimised for striker/hammer clicks.</p>
        
        <button id="initBtn">Initialise System</button>
        
        <div id="dashboard" class="dashboard">
            <div class="metric">
                <div class="metric-title">High-Freq Treble Output (Filtered)</div>
                <div class="metric-value" id="liveVolume">0</div>
            </div>
            <div class="metric">
                <div class="metric-title">Instantaneous Spike Velocity</div>
                <div class="metric-value" id="liveDelta">0</div>
            </div>
            <div class="status">🎯 Monitoring Audio Stream...</div>
        </div>
    </div>

    <script>
        const initBtn = document.getElementById('initBtn');
        const dashboard = document.getElementById('dashboard');
        const liveVolumeUi = document.getElementById('liveVolume');
        const liveDeltaUi = document.getElementById('liveDelta');

        let audioCtx, analyser, dataArray;
        
        // --- CALIBRATION PARAMETERS ---
        // Click signatures require massive high-end energy jumps over tiny periods
        const SPIKE_VELOCITY_THRESHOLD = 55; // Sudden spike magnitude 
        const FILTER_CUTOFF_FREQ = 4500;       // Strip everything under 4.5kHz (reloads)
        const COOL_DOWN = 400;                // Lockout window (ms)

        let previousVolume = 0;
        let lastTriggerTime = 0;

        initBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false, // Must disable browser filtering to catch rapid transients
                        autoGainControl: false
                    } 
                });

                initBtn.style.display = 'none';
                dashboard.style.display = 'block';

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);

                // LAYER 1: High-Pass hardware filtering
                const highPassFilter = audioCtx.createBiquadFilter();
                highPassFilter.type = "highpass";
                highPassFilter.frequency.value = FILTER_CUTOFF_FREQ; 

                // LAYER 2: Spectral Analysis setup
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; // Short window size for rapid snapshot speeds
                
                // Route stream: Mic -> Treble Filter -> Spectral Analyser
                source.connect(highPassFilter);
                highPassFilter.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                processAudioProcessingLoop();
            } catch (err) {
                alert('Audio subsystem access denied or unavailable.');
                console.error(err);
            }
        });

        function processAudioProcessingLoop() {
            analyser.getByteFrequencyData(dataArray);

            // Compute peak amplitude inside the isolated treble spectrum
            let highFreqPeak = 0;
            for (let i = 0; i < dataArray.length; i++) {
                if (dataArray[i] > highFreqPeak) {
                    highFreqPeak = dataArray[i];
                }
            }

            // LAYER 3: Calculate velocity (how fast did it go from quiet to loud?)
            let spikeVelocity = highFreqPeak - previousVolume;
            
            // Render Telemetry
            liveVolumeUi.innerText = highFreqPeak;
            liveDeltaUi.innerText = spikeVelocity > 0 ? spikeVelocity : 0;

            const now = Date.now();
            
            // Evaluation execution criteria
            if (spikeVelocity > SPIKE_VELOCITY_THRESHOLD && (now - lastTriggerTime) > COOL_DOWN) {
                executeAction();
                lastTriggerTime = now;
            }

            // Save historical volume context for next delta tick
            previousVolume = highFreqPeak;
            requestAnimationFrame(processAudioProcessingLoop);
        }

        function executeAction() {
            document.body.classList.add('shot-detected');
            setTimeout(() => {
                document.body.classList.remove('shot-detected');
            }, 80);
        }
    </script>
</body>
</html>
