<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Sequence Detector - Automated Limits</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --flash-color: #ff2e63;
            --step-color: #ffaa00;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.1s ease;
        }

        body.flash { background-color: var(--flash-color); }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 { margin-top: 0; font-size: 1.5rem; }

        .counter-box {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0 5px 0;
        }

        .status {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 15px;
            min-height: 40px;
            line-height: 1.4;
        }

        .step-tracker {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .step-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #555;
            transition: all 0.2s ease;
        }

        .step-dot.active {
            background: var(--step-color);
            border-color: var(--step-color);
            box-shadow: 0 0 8px var(--step-color);
        }

        .control-group {
            margin-bottom: 5px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #bbb;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        .value-display {
            float: right;
            font-weight: bold;
            color: var(--text-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(0, 173, 181, 0.3);
        }

        .meter-container {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #volume-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            transition: width 0.05s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sequence Detector</h1>
    <div class="counter-box" id="count-display">0</div>
    
    <div class="step-tracker">
        <div class="step-dot" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
    </div>
    
    <div class="status" id="status-display">Status: Stopped</div>

    <div class="meter-container">
        <div id="volume-bar"></div>
    </div>

    <div class="control-group">
        <label>Main Trigger Threshold: <span class="value-display" id="threshold-val">50</span></label>
        <input type="range" id="threshold-slider" min="10" max="100" value="50">
    </div>

    <button id="start-btn">Allow Mic & Start</button>
</div>

<script>
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let isListening = false;
    let isOnCooldown = false;
    let count = 0;
    let sequenceState = 0; 

    const startBtn = document.getElementById('start-btn');
    const statusDisplay = document.getElementById('status-display');
    const countDisplay = document.getElementById('count-display');
    const volumeBar = document.getElementById('volume-bar');
    const dot1 = document.getElementById('dot1');
    const dot2 = document.getElementById('dot2');
    
    const thresholdSlider = document.getElementById('threshold-slider');
    const thresholdVal = document.getElementById('threshold-val');

    thresholdSlider.oninput = () => {
        thresholdVal.innerText = thresholdSlider.value;
        if (isListening && sequenceState === 0) {
            updateStatusText();
        }
    };

    startBtn.onclick = async () => {
        if (isListening) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256; 
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            source.connect(analyser);
            isListening = true;
            updateStatusText();
            startBtn.style.display = 'none';
            detectSound();
        } catch (err) {
            alert("Microphone access denied.");
            statusDisplay.innerText = "Status: Error";
        }
    };

    function updateStatusText() {
        const mainThreshold = parseInt(thresholdSlider.value);
        const secondaryThreshold = Math.round(mainThreshold * 0.5);
        statusDisplay.innerHTML = `Listening for Main Trigger...<br><small style="color:#888;">(Secondary Target: ${secondaryThreshold})</small>`;
    }

    function detectSound() {
        if (!isListening) return;
        analyser.getByteFrequencyData(dataArray);
        let maxVolume = 0;
        for (let i = 0; i < dataArray.length; i++) {
            if (dataArray[i] > maxVolume) maxVolume = dataArray[i];
        }
        const currentVolume = Math.round((maxVolume / 255) * 100);
        
        if (!isOnCooldown) {
            volumeBar.style.width = currentVolume + '%';
            volumeBar.style.background = (sequenceState === 0) ? 'var(--accent-color)' : 'var(--step-color)';
        }

        const mainThreshold = parseInt(thresholdSlider.value);
        // Automatically scales to half of the main setting
        const secondaryThreshold = Math.round(mainThreshold * 0.5);

        if (!isOnCooldown) {
            if (sequenceState === 0 && currentVolume >= mainThreshold) {
                triggerMainReaction();
            } else if (sequenceState > 0 && currentVolume >= secondaryThreshold) {
                triggerIntermediateReaction();
            }
        }
        requestAnimationFrame(detectSound);
    }

    function triggerMainReaction() {
        isOnCooldown = true;
        count++;
        countDisplay.innerText = count;
        sequenceState = 1;
        statusDisplay.innerText = "Main triggered! Need 2 secondary sounds.";
        document.body.classList.add('flash');
        volumeBar.style.width = '100%';
        volumeBar.style.background = 'var(--flash-color)';
        setTimeout(() => document.body.classList.remove('flash'), 150);
        
        applyCooldown(500); // 500ms hardcoded for main
    }

    function triggerIntermediateReaction() {
        isOnCooldown = true;
        if (sequenceState === 1) {
            sequenceState = 2;
            dot1.classList.add('active');
            statusDisplay.innerText = "Sound 1/2 detected. Need 1 more.";
        } else if (sequenceState === 2) {
            sequenceState = 0;
            dot1.classList.remove('active');
            dot2.classList.remove('active');
            updateStatusText();
        }
        
        applyCooldown(300); // 300ms hardcoded for intermediate sounds
    }

    function applyCooldown(delayDuration) {
        setTimeout(() => {
            isOnCooldown = false;
            if (sequenceState === 2) {
                dot2.classList.add('active');
            }
            if (isListening && !isOnCooldown && sequenceState === 0) {
                updateStatusText();
            }
        }, delayDuration);
    }
</script>
</body>
</html>
