<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Detector</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --flash-color: #ff2e63;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.1s ease;
        }

        body.flash {
            background-color: var(--flash-color);
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 { margin-top: 0; font-size: 1.5rem; }

        .counter-box {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
        }

        .status {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #bbb;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        .value-display {
            float: right;
            font-weight: bold;
            color: var(--text-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0, 173, 181, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Visual volume meter bar */
        .meter-container {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 6px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        #volume-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            transition: width 0.05s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Noise Detector</h1>
    
    <div class="counter-box" id="count-display">0</div>
    <div class="status" id="status-display">Status: Stopped</div>

    <div class="meter-container">
        <div id="volume-bar"></div>
    </div>

    <div class="control-group">
        <label>Sensitivity Threshold: <span class="value-display" id="threshold-val">50</span></label>
        <input type="range" id="threshold-slider" min="5" max="100" value="50">
    </div>

    <div class="control-group">
        <label>Cool-down Delay: <span class="value-display" id="cooldown-val">500ms</span></label>
        <input type="range" id="cooldown-slider" min="100" max="2000" step="50" value="500">
    </div>

    <button id="start-btn">Allow Mic & Start</button>
</div>

<script>
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let isListening = false;
    let isOnCooldown = false;
    let count = 0;

    // DOM Elements
    const startBtn = document.getElementById('start-btn');
    const statusDisplay = document.getElementById('status-display');
    const countDisplay = document.getElementById('count-display');
    const volumeBar = document.getElementById('volume-bar');
    
    const thresholdSlider = document.getElementById('threshold-slider');
    const thresholdVal = document.getElementById('threshold-val');
    const cooldownSlider = document.getElementById('cooldown-slider');
    const cooldownVal = document.getElementById('cooldown-val');

    // Update Slider UI Labels
    thresholdSlider.oninput = () => thresholdVal.innerText = thresholdSlider.value;
    cooldownSlider.oninput = () => cooldownVal.innerText = cooldownSlider.value + 'ms';

    startBtn.onclick = async () => {
        if (isListening) return; // Already running

        try {
            // 1. Request microphone permission
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            // 2. Initialize Audio Nodes
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            
            // Fast polling config
            analyser.fftSize = 256; 
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            source.connect(analyser);
            
            isListening = true;
            statusDisplay.innerText = "Status: Listening...";
            startBtn.style.display = 'none'; // Hide button once authorized
            
            // 3. Start processing loop
            detectSound();
            
        } catch (err) {
            alert("Microphone access denied or unsupported on this browser.");
            statusDisplay.innerText = "Status: Permission Error";
            console.error(err);
        }
    };

    function detectSound() {
        if (!isListening) return;

        // Pull the frequency/amplitude data
        analyser.getByteFrequencyData(dataArray);

        // Find the absolute highest peak value in the current audio chunk
        let maxVolume = 0;
        for (let i = 0; i < dataArray.length; i++) {
            if (dataArray[i] > maxVolume) {
                maxVolume = dataArray[i];
            }
        }

        // Convert byte range (0-255) to a clean 0-100 scale
        const currentVolumeNormalized = Math.round((maxVolume / 255) * 100);
        
        // Dynamic visual feedback bar
        if (!isOnCooldown) {
            volumeBar.style.width = currentVolumeNormalized + '%';
        }

        const userThreshold = parseInt(thresholdSlider.value);

        // Check if sound breaks past the limit
        if (currentVolumeNormalized >= userThreshold && !isOnCooldown) {
            triggerReaction();
        }

        // Keep loop ticking at screen refresh rate (~60fps to 120fps)
        requestAnimationFrame(detectSound);
    }

    function triggerReaction() {
        isOnCooldown = true;
        count++;
        countDisplay.innerText = count;
        statusDisplay.innerText = "Status: Ignored (Cooling down)";
        
        // Flash screen background
        document.body.classList.add('flash');
        volumeBar.style.width = '100%';
        volumeBar.style.background = 'var(--flash-color)';

        // Remove flash look quickly
        setTimeout(() => {
            document.body.classList.remove('flash');
        }, 150);

        // Track user dynamic settings for delay
        const cooldownDelay = parseInt(cooldownSlider.value);

        // Wait out the cool-down phase before listening to peaks again
        setTimeout(() => {
            isOnCooldown = false;
            volumeBar.style.background = 'var(--accent-color)';
            if (isListening) {
                statusDisplay.innerText = "Status: Listening...";
            }
        }, cooldownDelay);
    }
</script>
</body>
</html>
