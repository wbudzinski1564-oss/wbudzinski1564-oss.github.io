<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click vs Double-Clap Detector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin-top: 60px;
        }
        button {
            padding: 14px 28px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            margin-bottom: 25px;
        }
        button:disabled { background-color: #475569; }
        #status { font-size: 18px; color: #94a3b8; margin-bottom: 25px; }
        .event-box {
            font-size: 32px;
            font-weight: bold;
            padding: 24px;
            border-radius: 12px;
            display: inline-block;
            min-width: 320px;
            background-color: #1e293b;
            transition: background-color 0.15s ease;
        }
        .event-a { background-color: #0284c7; color: white; } /* Blue for Event A (Click) */
        .event-b { background-color: #16a34a; color: white; } /* Green for Event B (Claps) */
    </style>
</head>
<body>

    <h1>Audio Event Classifier</h1>
    <p>Distinguishes <strong>Event A</strong> (Click) from <strong>Event B</strong> (Double Clap)</p>
    
    <button id="startButton">Start Listening</button>
    <div id="status">Microphone inactive.</div>

    <div id="display" class="event-box">Waiting for sound...</div>

    <script>
        const startBtn = document.getElementById('startButton');
        const statusDiv = document.getElementById('status');
        const displayDiv = document.getElementById('display');

        let audioContext;
        let analyser;
        let isListening = false;
        
        let isProcessing = false;
        let clapTimer = null;

        startBtn.addEventListener('click', async () => {
            if (isListening) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                const microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);

                isListening = true;
                startBtn.disabled = true;
                statusDiv.innerText = "Listening...";

                detectEvents();
            } catch (err) {
                alert("Microphone access failed: " + err.message);
            }
        });

        function detectEvents() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function analyzeFrame() {
                if (!isListening) return;

                analyser.getByteFrequencyData(dataArray);

                // Ultra-high frequencies (>4 kHz)
                let ultraHighEnergy = 0;
                for (let i = 40; i < 90 && i < bufferLength; i++) {
                    ultraHighEnergy += dataArray[i];
                }
                ultraHighEnergy /= 50;

                // Mid-High frequencies (~1.5 kHz - 4 kHz)
                let midEnergy = 0;
                for (let i = 10; i < 35 && i < bufferLength; i++) {
                    midEnergy += dataArray[i];
                }
                midEnergy /= 25;

                const CLICK_THRESHOLD = 75;
                const CLAP_THRESHOLD = 90;

                if (!isProcessing) {
                    // Detect Event A: Single sharp click
                    if (ultraHighEnergy > CLICK_THRESHOLD && ultraHighEnergy > midEnergy * 1.1) {
                        triggerEvent("EVENT A: Click", "event-a", 800);
                    } 
                    // Detect Event B: Initial Clap detected -> Start aggregation window
                    else if (midEnergy > CLAP_THRESHOLD) {
                        isProcessing = true;
                        
                        // Wait 500ms to allow both claps to finish before triggering Event B once
                        clapTimer = setTimeout(() => {
                            triggerEvent("EVENT B: Claps", "event-b", 800);
                        }, 500);
                    }
                }

                requestAnimationFrame(analyzeFrame);
            }

            analyzeFrame();
        }

        function triggerEvent(label, cssClass, displayDuration) {
            isProcessing = true;
            displayDiv.innerText = label;
            displayDiv.className = `event-box ${cssClass}`;

            setTimeout(() => {
                displayDiv.innerText = "Waiting for sound...";
                displayDiv.className = "event-box";
                isProcessing = false;
            }, displayDuration);
        }
    </script>
</body>
</html>
