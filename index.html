<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event A Exclusive Detector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        button {
            padding: 14px 28px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            margin-bottom: 25px;
        }
        button:disabled { background-color: #475569; }
        .event-box {
            font-size: 32px;
            font-weight: bold;
            padding: 30px;
            border-radius: 12px;
            background-color: #1e293b;
            transition: background-color 0.1s ease;
            min-height: 50px;
        }
        .event-a { background-color: #0284c7; color: white; } /* Blue for Event A */
        
        .sensitivity-control {
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
        }
        input[type=range] { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Event A Detector</h1>
    <p>Triggers <strong>ONLY</strong> on Event A. Ignores all other sounds.</p>

    <button id="startButton">Start Listening</button>

    <div id="display" class="event-box">Listening inactive</div>

    <div class="sensitivity-control">
        <label for="threshold">Event A Sensitivity Slope Threshold: <strong id="thresh-val">15</strong></label>
        <input type="range" id="threshold" min="5" max="60" value="15">
        <p style="font-size: 12px; color: #94a3b8; margin-top: 8px; margin-bottom: 0;">
            • Lower value = More sensitive to light clicks.<br>
            • Higher value = Only sharp/loud clicks trigger.
        </p>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startButton');
    const displayDiv = document.getElementById('display');
    const threshSlider = document.getElementById('threshold');
    const threshVal = document.getElementById('thresh-val');

    let audioContext;
    let analyser;
    let isListening = false;
    let isProcessing = false;
    let previousHighFreqEnergy = 0;

    threshSlider.oninput = () => threshVal.innerText = threshSlider.value;

    startBtn.addEventListener('click', async () => {
        if (isListening) return;

        try {
            // Raw microphone stream without browser noise filtering
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    noiseSuppression: false, 
                    echoCancellation: false,
                    autoGainControl: false 
                } 
            });
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            
            // FFT Size 128 gives ultra-fast temporal resolution to capture sudden click spikes
            analyser.fftSize = 128; 

            const microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);

            isListening = true;
            startBtn.disabled = true;
            displayDiv.innerText = "Waiting for Event A...";

            detectEventA();
        } catch (err) {
            alert("Microphone access failed: " + err.message);
        }
    });

    function detectEventA() {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function analyzeFrame() {
            if (!isListening) return;

            analyser.getByteFrequencyData(dataArray);

            // Isolate upper high-frequency bins (Top 30% of spectrum)
            let highFreqEnergy = 0;
            let count = 0;
            const startBin = Math.floor(bufferLength * 0.6); // Upper spectrum
            
            for (let i = startBin; i < bufferLength; i++) {
                highFreqEnergy += dataArray[i];
                count++;
            }
            const currentEnergy = highFreqEnergy / count;

            // Calculate the sudden rise (delta) between current frame and previous frame
            const energyDelta = currentEnergy - previousHighFreqEnergy;
            previousHighFreqEnergy = currentEnergy;

            const targetThreshold = parseInt(threshSlider.value);

            if (!isProcessing) {
                // Event A fires ONLY if energy jumps suddenly above the slope threshold
                if (energyDelta >= targetThreshold) {
                    triggerEventA();
                }
            }

            requestAnimationFrame(analyzeFrame);
        }

        analyzeFrame();
    }

    function triggerEventA() {
        isProcessing = true;
        displayDiv.innerText = "EVENT A DETECTED!";
        displayDiv.className = "event-box event-a";

        // Perform whatever action you need for Event A here
        console.log("Event A triggered at: " + new Date().toISOString());

        setTimeout(() => {
            displayDiv.innerText = "Waiting for Event A...";
            displayDiv.className = "event-box";
            isProcessing = false;
        }, 500);
    }
</script>
</body>
</html>
