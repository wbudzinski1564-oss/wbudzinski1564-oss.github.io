<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">
<title>Continuous Acoustic Event Classifier</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: #eee;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
}
.container {
    max-width: 700px;
    margin: auto;
}
h1 {
    font-size: 24px;
    margin-bottom: 8px;
}
p {
    color: #aaa;
    line-height: 1.5;
}
button {
    width: 100%;
    padding: 14px;
    margin: 6px 0;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}
#startButton {
    background: #2ecc71;
    color: white;
}
#stopButton {
    background: #444;
    color: white;
}
button:active {
    transform: scale(0.99);
}
.panel {
    margin-top: 18px;
    padding: 16px;
    background: #1c1c1c;
    border-radius: 12px;
}
.row {
    margin: 18px 0;
}
label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}
input[type="range"] {
    width: 100%;
}
.meter {
    width: 100%;
    height: 20px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}
#levelBar {
    height: 100%;
    width: 0%;
    background: #2ecc71;
    transition:
        width 0.03s linear;
}
.status {
    margin-top: 18px;
    padding: 15px;
    background: #252525;
    border-radius: 10px;
    text-align: center;
    font-size: 17px;
}
.status.detected {
    background: #244d35;
}
.similarity-number {
    font-size: 32px;
    font-weight: bold;
    margin-top: 5px;
}
.small {
    font-size: 13px;
    color: #888;
    line-height: 1.5;
}
.value {
    font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>
<div class="container">
    <h1>
        Continuous Acoustic Event Classifier
    </h1>
    <p>
        Continuously monitors the microphone, detects short
        acoustic events, and compares them with a learned
        reference profile.
    </p>
    <!-- CONTROLS -->
    <button id="startButton">
        Start microphone
    </button>
    <button id="stopButton">
        Stop
    </button>
    <!-- SETTINGS -->
    <div class="panel">
        <div class="row">
            <label>
                <span>
                    Detection threshold
                </span>
                <span
                    id="thresholdValue"
                    class="value">
                    0.008
                </span>
            </label>
            <input
                id="thresholdSlider"
                type="range"
                min="0.001"
                max="0.100"
                step="0.001"
                value="0.008">
        </div>
        <div class="row">
            <label>
                <span>
                    Similarity required
                </span>
                <span
                    id="similarityThresholdValue"
                    class="value">
                    0.75
                </span>
            </label>
            <input
                id="similaritySlider"
                type="range"
                min="0.40"
                max="0.99"
                step="0.01"
                value="0.75">
        </div>
        <div class="row">
            <label>
                <span>
                    Microphone level
                </span>
            </label>
            <div class="meter">
                <div id="levelBar"></div>
            </div>
        </div>
    </div>
    <!-- SIMILARITY -->
    <div class="panel">
        <strong>
            Current similarity
        </strong>
        <div
            id="similarity"
            class="similarity-number">
            --
        </div>
        <div class="small">
            1.000 means the current feature profile is
            extremely similar to the reference profile.
        </div>
    </div>
    <!-- STATUS -->
    <div
        id="status"
        class="status">
        Microphone stopped
    </div>
</div>
<script>
/*
============================================================
CONTINUOUS ACOUSTIC EVENT CLASSIFIER
============================================================
The system works as follows:
    Microphone
        ↓
    AudioContext
        ↓
    AnalyserNode
        ↓
    Event detector
        ↓
    Feature extraction
        ↓
    Reference comparison
        ↓
    Detection callback
The first detected acoustic event becomes the
reference profile.
There is no reset/reload button.
The microphone continues listening indefinitely.
============================================================
*/
// ============================================================
// CONFIGURATION
// ============================================================
const FFT_SIZE = 2048;
const MIN_EVENT_DURATION = 0.025;
const MAX_EVENT_DURATION = 0.30;
const REFRACTORY_TIME = 0.12;
// ============================================================
// AUDIO STATE
// ============================================================
let audioContext = null;
let microphoneStream = null;
let sourceNode = null;
let analyser = null;
let timeData = null;
let frequencyData = null;
let animationFrame = null;
let running = false;
// ============================================================
// CLASSIFIER STATE
// ============================================================
let referenceProfile = null;
let eventActive = false;
let eventStart = 0;
let eventSamples = [];
let lastEventTime = -Infinity;
let noiseFloor = 0.002;
// ============================================================
// SETTINGS
// ============================================================
let detectionThreshold = 0.008;
let similarityThreshold = 0.75;
// ============================================================
// UI REFERENCES
// ============================================================
const startButton =
    document.getElementById(
        "startButton"
    );
const stopButton =
    document.getElementById(
        "stopButton"
    );
const thresholdSlider =
    document.getElementById(
        "thresholdSlider"
    );
const similaritySlider =
    document.getElementById(
        "similaritySlider"
    );
const thresholdValue =
    document.getElementById(
        "thresholdValue"
    );
const similarityThresholdValue =
    document.getElementById(
        "similarityThresholdValue"
    );
const levelBar =
    document.getElementById(
        "levelBar"
    );
const similarityDisplay =
    document.getElementById(
        "similarity"
    );
const statusDisplay =
    document.getElementById(
        "status"
    );
// ============================================================
// SLIDER INITIALIZATION
// ============================================================
thresholdSlider.value =
    detectionThreshold;
similaritySlider.value =
    similarityThreshold;
thresholdValue.textContent =
    detectionThreshold.toFixed(3);
similarityThresholdValue.textContent =
    similarityThreshold.toFixed(2);
// ============================================================
// THRESHOLD SLIDER
// ============================================================
thresholdSlider.addEventListener(
    "input",
    function () {
        detectionThreshold =
            Number(
                thresholdSlider.value
            );
        thresholdValue.textContent =
            detectionThreshold.toFixed(3);
    }
);
// ============================================================
// SIMILARITY SLIDER
// ============================================================
similaritySlider.addEventListener(
    "input",
    function () {
        similarityThreshold =
            Number(
                similaritySlider.value
            );
        similarityThresholdValue.textContent =
            similarityThreshold.toFixed(2);
    }
);
// ============================================================
// START MICROPHONE
// ============================================================
startButton.addEventListener(
    "click",
    startMicrophone
);
async function startMicrophone() {
    if (running)
        return;
    try {
        /*
            Request microphone access.
        */
        microphoneStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: {
                        echoCancellation:
                            false,
                        noiseSuppression:
                            false,
                        autoGainControl:
                            false
                    }
                });
        /*
            Create audio context.
        */
        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        /*
            iOS/Safari can initially suspend
            the AudioContext.
        */
        await audioContext.resume();
        /*
            Connect microphone.
        */
        sourceNode =
            audioContext
                .createMediaStreamSource(
                    microphoneStream
                );
        /*
            Create analyser.
        */
        analyser =
            audioContext
                .createAnalyser();
        analyser.fftSize =
            FFT_SIZE;
        analyser.smoothingTimeConstant =
            0;
        /*
            Allocate buffers.
        */
        timeData =
            new Float32Array(
                analyser.fftSize
            );
        frequencyData =
            new Float32Array(
                analyser.frequencyBinCount
            );
        /*
            Connect microphone to analyser.
            IMPORTANT:
            We do NOT connect the analyser
            to audioContext.destination.
            Therefore the microphone isn't
            played through the phone speaker.
        */
        sourceNode.connect(
            analyser
        );
        /*
            Reset classifier state for this
            listening session.
        */
        referenceProfile =
            null;
        eventActive =
            false;
        eventSamples =
            [];
        lastEventTime =
            -Infinity;
        noiseFloor =
            0.002;
        running =
            true;
        similarityDisplay.textContent =
            "--";
        statusDisplay.textContent =
            "Listening... waiting for reference event";
        statusDisplay.classList.remove(
            "detected"
        );
        /*
            Begin continuous processing.
        */
        processAudio();
    } catch (error) {
        console.error(
            "Microphone error:",
            error
        );
        statusDisplay.textContent =
            "Unable to access microphone";
    }
}
// ============================================================
// STOP MICROPHONE
// ============================================================
stopButton.addEventListener(
    "click",
    stopMicrophone
);
function stopMicrophone() {
    running =
        false;
    if (
        animationFrame !==
        null
    ) {
        cancelAnimationFrame(
            animationFrame
        );
        animationFrame =
            null;
    }
    if (
        microphoneStream
    ) {
        microphoneStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
        microphoneStream =
            null;
    }
    if (
        audioContext
    ) {
        audioContext.close();
        audioContext =
            null;
    }
    sourceNode =
        null;
    analyser =
        null;
    timeData =
        null;
    frequencyData =
        null;
    eventActive =
        false;
    eventSamples =
        [];
    levelBar.style.width =
        "0%";
    similarityDisplay.textContent =
        "--";
    statusDisplay.textContent =
        "Microphone stopped";
    statusDisplay.classList.remove(
        "detected"
    );
}
// ============================================================
// MAIN AUDIO LOOP
// ============================================================
function processAudio() {
    if (!running)
        return;
    /*
        Read current waveform.
    */
    analyser.getFloatTimeDomainData(
        timeData
    );
    /*
        Read frequency-domain data.
        This isn't directly needed by the
        event detector, but keeps the analyser
        ready for real-time spectral information.
    */
    analyser.getFloatFrequencyData(
        frequencyData
    );
    /*
        Calculate RMS.
    */
    const rms =
        getRMS(
            timeData
        );
    /*
        Calculate instantaneous peak.
    */
    const peak =
        getPeak(
            timeData
        );
    /*
        Slowly estimate background noise.
        This only updates when we're not currently
        inside an acoustic event.
    */
    if (!eventActive) {
        noiseFloor =
            noiseFloor * 0.995 +
            rms * 0.005;
    }
    /*
        Update level meter.
        Peak is used because very short events
        may have a high peak but modest RMS.
    */
    const displayLevel =
        Math.min(
            1,
            peak / 0.15
        );
    levelBar.style.width =
        (
            displayLevel * 100
        ) + "%";
    /*
        Process event detection.
    */
    detectEvent(
        rms,
        peak
    );
    /*
        Continue indefinitely.
    */
    animationFrame =
        requestAnimationFrame(
            processAudio
        );
}
// ============================================================
// RMS
// ============================================================
function getRMS(
    samples
) {
    let sum = 0;
    for (
        let i = 0;
        i < samples.length;
        i++
    ) {
        sum +=
            samples[i] *
            samples[i];
    }
    return Math.sqrt(
        sum /
        samples.length
    );
}
// ============================================================
// PEAK
// ============================================================
function getPeak(
    samples
) {
    let peak = 0;
    for (
        let i = 0;
        i < samples.length;
        i++
    ) {
        const value =
            Math.abs(
                samples[i]
            );
        if (
            value > peak
        ) {
            peak =
                value;
        }
    }
    return peak;
}
// ============================================================
// EVENT DETECTION
// ============================================================
function detectEvent(
    rms,
    peak
) {
    const now =
        performance.now() /
        1000;
    /*
        Prevent the same acoustic event from
        generating multiple detections.
    */
    if (
        now -
        lastEventTime <
        REFRACTORY_TIME
    ) {
        return;
    }
    /*
        RMS trigger.
    */
    const rmsTrigger =
        rms >=
        detectionThreshold;
    /*
        Peak trigger.
        This catches short transients that don't
        produce enough RMS over the whole analyser
        frame.
    */
    const peakTrigger =
        peak >=
        detectionThreshold * 2.0;
    // --------------------------------------------------------
    // START EVENT
    // --------------------------------------------------------
    if (!eventActive) {
        if (
            rmsTrigger ||
            peakTrigger
        ) {
            eventActive =
                true;
            eventStart =
                now;
            eventSamples =
                [];
            addSamples(
                timeData
            );
            statusDisplay.textContent =
                "Acoustic event...";
        }
        return;
    }
    // --------------------------------------------------------
    // CONTINUE EVENT
    // --------------------------------------------------------
    addSamples(
        timeData
    );
    const duration =
        now -
        eventStart;
    /*
        Determine whether the event has
        become quiet.
    */
    const quiet =
        rms <
        Math.max(
            noiseFloor * 2,
            detectionThreshold * 0.25
        );
    /*
        End the event when:
        - it has lasted at least 25 ms and
          becomes quiet
        OR
        - it reaches 300 ms.
    */
    if (
        (
            quiet &&
            duration >=
            MIN_EVENT_DURATION
        )
        ||
        duration >=
        MAX_EVENT_DURATION
    ) {
        finishEvent();
        eventActive =
            false;
        lastEventTime =
            now;
        eventSamples =
            [];
    }
}
// ============================================================
// COLLECT EVENT SAMPLES
// ============================================================
function addSamples(
    samples
) {
    if (!audioContext)
        return;
    const maxSamples =
        Math.floor(
            audioContext.sampleRate *
            0.35
        );
    for (
        let i = 0;
        i < samples.length;
        i++
    ) {
        if (
            eventSamples.length >=
            maxSamples
        ) {
            break;
        }
        eventSamples.push(
            samples[i]
        );
    }
}
// ============================================================
// FINISH EVENT
// ============================================================
function finishEvent() {
    /*
        Ignore extremely short buffers.
    */
    if (
        eventSamples.length <
        200
    ) {
        return;
    }
    /*
        Extract acoustic features.
    */
    const features =
        extractFeatures(
            eventSamples,
            audioContext.sampleRate
        );
    /*
        First event becomes reference.
    */
    if (
        referenceProfile ===
        null
    ) {
        referenceProfile =
            features;
        similarityDisplay.textContent =
            "REFERENCE";
        statusDisplay.textContent =
            "Reference learned — listening continuously";
        return;
    }
    /*
        Compare subsequent events.
    */
    const similarity =
        compareFeatures(
            features,
            referenceProfile
        );
    similarityDisplay.textContent =
        similarity.toFixed(3);
    /*
        Check classification threshold.
    */
    if (
        similarity >=
        similarityThreshold
    ) {
        acousticEventDetected(
            similarity,
            features
        );
    } else {
        statusDisplay.textContent =
            "Other acoustic event";
        statusDisplay.classList.remove(
            "detected"
        );
    }
}
// ============================================================
// FEATURE EXTRACTION
// ============================================================
function extractFeatures(
    samples,
    sampleRate
) {
    const rms =
        getRMS(
            samples
        );
    const peak =
        getPeak(
            samples
        );
    /*
        Crest factor.
        This measures how impulsive the event is.
    */
    const crest =
        peak /
        Math.max(
            rms,
            0.000001
        );
    /*
        Zero-crossing rate.
    */
    let crossings =
        0;
    for (
        let i = 1;
        i < samples.length;
        i++
    ) {
        if (
            (
                samples[i - 1] < 0 &&
                samples[i] >= 0
            )
            ||
            (
                samples[i - 1] >= 0 &&
                samples[i] < 0
            )
        ) {
            crossings++;
        }
    }
    const zeroCrossingRate =
        crossings /
        samples.length;
    /*
        Calculate spectrum.
    */
    const spectrum =
        getSpectrum(
            samples
        );
    /*
        Spectral features.
    */
    const centroid =
        getCentroid(
            spectrum,
            sampleRate
        );
    const rolloff =
        getRolloff(
            spectrum,
            sampleRate
        );
    const bands =
        getBands(
            spectrum,
            sampleRate
        );
    return {
        rms,
        peak,
        crest,
        zeroCrossingRate,
        centroid,
        rolloff,
        bands
    };
}
// ============================================================
// SPECTRUM
// ============================================================
function getSpectrum(
    samples
) {
    /*
        Use 1024-point FFT.
    */
    const N =
        1024;
    const real =
        new Float64Array(
            N
        );
    const imag =
        new Float64Array(
            N
        );
    /*
        Take the middle section of the event.
    */
    const start =
        Math.max(
            0,
            Math.floor(
                (
                    samples.length -
                    N
                ) / 2
            )
        );
    /*
        Apply Hann window.
    */
    for (
        let i = 0;
        i < N;
        i++
    ) {
        const index =
            start + i;
        const sample =
            index <
            samples.length
                ? samples[index]
                : 0;
        const window =
            0.5 -
            0.5 *
            Math.cos(
                2 *
                Math.PI *
                i /
                (N - 1)
            );
        real[i] =
            sample *
            window;
    }
    /*
        FFT.
    */
    fft(
        real,
        imag
    );
    /*
        Convert complex FFT into magnitude spectrum.
    */
    const spectrum =
        new Float64Array(
            N / 2
        );
    for (
        let i = 0;
        i < spectrum.length;
        i++
    ) {
        spectrum[i] =
            Math.sqrt(
                real[i] *
                real[i]
                +
                imag[i] *
                imag[i]
            );
    }
    return spectrum;
}
// ============================================================
// RADIX-2 FFT
// ============================================================
function fft(
    real,
    imag
) {
    const N =
        real.length;
    /*
        Bit reversal.
    */
    for (
        let i = 1,
        j = 0;
        i < N;
        i++
    ) {
        let bit =
            N >> 1;
        while (
            j & bit
        ) {
            j ^=
                bit;
            bit >>=
                1;
        }
        j ^=
            bit;
        if (
            i < j
        ) {
            let temp =
                real[i];
            real[i] =
                real[j];
            real[j] =
                temp;
            temp =
                imag[i];
            imag[i] =
                imag[j];
            imag[j] =
                temp;
        }
    }
    /*
        FFT stages.
    */
    for (
        let length = 2;
        length <= N;
        length <<= 1
    ) {
        const angle =
            -2 *
            Math.PI /
            length;
        const wReal =
            Math.cos(
                angle
            );
        const wImag =
            Math.sin(
                angle
            );
        for (
            let i = 0;
            i < N;
            i += length
        ) {
            let currentReal =
                1;
            let currentImag =
                0;
            for (
                let j = 0;
                j <
                length / 2;
                j++
            ) {
                const index =
                    i + j;
                const second =
                    index +
                    length / 2;
                const tempReal =
                    real[second] *
                    currentReal
                    -
                    imag[second] *
                    currentImag;
                const tempImag =
                    real[second] *
                    currentImag
                    +
                    imag[second] *
                    currentReal;
                real[second] =
                    real[index] -
                    tempReal;
                imag[second] =
                    imag[index] -
                    tempImag;
                real[index] +=
                    tempReal;
                imag[index] +=
                    tempImag;
                const nextReal =
                    currentReal *
                    wReal
                    -
                    currentImag *
                    wImag;
                const nextImag =
                    currentReal *
                    wImag
                    +
                    currentImag *
                    wReal;
                currentReal =
                    nextReal;
                currentImag =
                    nextImag;
            }
        }
    }
}
// ============================================================
// SPECTRAL CENTROID
// ============================================================
function getCentroid(
    spectrum,
    sampleRate
) {
    let numerator =
        0;
    let denominator =
        0;
    for (
        let i = 0;
        i < spectrum.length;
        i++
    ) {
        const frequency =
            i *
            sampleRate /
            (
                spectrum.length *
                2
            );
        const magnitude =
            spectrum[i];
        numerator +=
            frequency *
            magnitude;
        denominator +=
            magnitude;
    }
    if (
        denominator === 0
    ) {
        return 0;
    }
    return (
        numerator /
        denominator
    );
}
// ============================================================
// SPECTRAL ROLLOFF
// ============================================================
function getRolloff(
    spectrum,
    sampleRate
) {
    let total =
        0;
    for (
        const value of spectrum
    ) {
        total +=
            value;
    }
    const target =
        total *
        0.85;
    let accumulated =
        0;
    for (
        let i = 0;
        i < spectrum.length;
        i++
    ) {
        accumulated +=
            spectrum[i];
        if (
            accumulated >=
            target
        ) {
            return (
                i *
                sampleRate /
                (
                    spectrum.length *
                    2
                )
            );
        }
    }
    return (
        sampleRate / 2
    );
}
// ============================================================
// SPECTRAL BANDS
// ============================================================
function getBands(
    spectrum,
    sampleRate
) {
    const ranges = [
        [0, 500],
        [500, 1500],
        [1500, 3000],
        [3000, 6000],
        [6000, 12000],
        [12000, 20000]
    ];
    const bands =
        new Array(
            ranges.length
        ).fill(0);
    let total =
        0;
    for (
        let i = 0;
        i < spectrum.length;
        i++
    ) {
        const frequency =
            i *
            sampleRate /
            (
                spectrum.length *
                2
            );
        const magnitude =
            spectrum[i];
        total +=
            magnitude;
        for (
            let b = 0;
            b < ranges.length;
            b++
        ) {
            if (
                frequency >=
                ranges[b][0]
                &&
                frequency <
                ranges[b][1]
            ) {
                bands[b] +=
                    magnitude;
                break;
            }
        }
    }
    /*
        Convert to proportions.
    */
    if (
        total > 0
    ) {
        for (
            let i = 0;
            i < bands.length;
            i++
        ) {
            bands[i] /=
                total;
        }
    }
    return bands;
}
// ============================================================
// FEATURE COMPARISON
// ============================================================
function compareFeatures(
    a,
    b
) {
    const bandSimilarity =
        cosineSimilarity(
            a.bands,
            b.bands
        );
    const centroidSimilarity =
        ratioSimilarity(
            a.centroid,
            b.centroid
        );
    const rolloffSimilarity =
        ratioSimilarity(
            a.rolloff,
            b.rolloff
        );
    const zeroCrossSimilarity =
        ratioSimilarity(
            a.zeroCrossingRate,
            b.zeroCrossingRate
        );
    /*
        Weighted combination.
        Spectral distribution gets the largest
        contribution because it is relatively
        independent of microphone volume.
    */
    return (
        bandSimilarity * 0.55
        +
        centroidSimilarity * 0.20
        +
        rolloffSimilarity * 0.15
        +
        zeroCrossSimilarity * 0.10
    );
}
// ============================================================
// RATIO SIMILARITY
// ============================================================
function ratioSimilarity(
    a,
    b
) {
    const denominator =
        Math.max(
            Math.abs(a),
            Math.abs(b),
            0.000001
        );
    const difference =
        Math.abs(
            a - b
        ) /
        denominator;
    return Math.max(
        0,
        1 -
        difference
    );
}
// ============================================================
// COSINE SIMILARITY
// ============================================================
function cosineSimilarity(
    a,
    b
) {
    let dot =
        0;
    let magnitudeA =
        0;
    let magnitudeB =
        0;
    for (
        let i = 0;
        i < a.length;
        i++
    ) {
        dot +=
            a[i] *
            b[i];
        magnitudeA +=
            a[i] *
            a[i];
        magnitudeB +=
            b[i] *
            b[i];
    }
    const denominator =
        Math.sqrt(
            magnitudeA *
            magnitudeB
        );
    if (
        denominator === 0
    ) {
        return 0;
    }
    return (
        dot /
        denominator
    );
}
// ============================================================
// DETECTION CALLBACK
// ============================================================
function acousticEventDetected(
    similarity,
    features
) {
    statusDisplay.textContent =
        "REFERENCE-MATCHING EVENT DETECTED";
    statusDisplay.classList.add(
        "detected"
    );
    /*
        This is where you put the action
        you want the website to perform.
        For example:
            triggerAnimation();
            updateSomething();
            sendAnEvent();
        The microphone remains active.
    */
    console.log(
        "Matching acoustic event detected:",
        similarity
    );
    console.log(
        "Features:",
        features
    );
    /*
        Remove the visual indication after
        a short period while continuing to listen.
    */
    setTimeout(
        function () {
            if (
                running
            ) {
                statusDisplay.classList.remove(
                    "detected"
                );
            }
        },
        300
    );
}
