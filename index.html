<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dry Fire</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
        }

        #mainMenu, #workoutMenu, #countdownScreen, #gameOverMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 10;
        }

        #workoutMenu, #countdownScreen, #gameOverMenu {
            display: none;
        }

        h1 {
            font-size: 3rem;
            color: #000000;
            margin: 0 0 2rem 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .play-btn {
            padding: 15px 40px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #000000;
            border: 2px solid #000000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .workout-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 85%;
            max-width: 900px;
        }

        .workout-btn {
            padding: 20px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #000000;
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }

        .workout-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        #countdownScreen h2 {
            font-size: 2.2rem;
            color: #000000;
            margin: 0 0 1rem 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #countdownNumber {
            font-size: 5rem;
            font-weight: bold;
            color: #000000;
            font-family: monospace;
        }

        #timerHUD {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #000000;
            font-family: monospace;
            z-index: 5;
            display: none;
        }

        #orientationWarning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #orientationWarning p {
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            margin-top: 15px;
        }

        @media (orientation: portrait) {
            #orientationWarning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="orientationWarning">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg>
        <p>Please rotate your device sideways to play!</p>
    </div>

    <div id="mainMenu">
        <h1>Dry Fire</h1>
        <button class="play-btn" onclick="showWorkoutMenu()">Play</button>
    </div>

    <div id="workoutMenu">
        <h1>Select Workout</h1>
        <div class="workout-grid">
            <button class="workout-btn" onclick="startSetupSequence('A')">Workout A</button>
            <button class="workout-btn" onclick="startSetupSequence('B')">Workout B</button>
            <button class="workout-btn" onclick="startSetupSequence('C')">Workout C</button>
            <button class="workout-btn" onclick="startSetupSequence('D')">Workout D</button>
            <button class="workout-btn" onclick="startSetupSequence('E')">Workout E</button>
            <button class="workout-btn" onclick="startSetupSequence('F')">Workout F</button>
            <button class="workout-btn" onclick="startSetupSequence('G')">Workout G</button>
            <button class="workout-btn" onclick="startSetupSequence('H')">Workout H</button>
        </div>
    </div>

    <div id="countdownScreen">
        <h2>Distance: 5 Meters</h2>
        <div id="countdownNumber">5</div>
    </div>

    <div id="gameOverMenu">
        <h1>Drill Complete!</h1>
        <button class="play-btn" onclick="returnToWorkouts()">Main Menu</button>
    </div>

    <div id="timerHUD">1:00</div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const mainMenu = document.getElementById('mainMenu');
        const workoutMenu = document.getElementById('workoutMenu');
        const countdownScreen = document.getElementById('countdownScreen');
        const countdownNumber = document.getElementById('countdownNumber');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const timerHUD = document.getElementById('timerHUD');

        let animationFrameId;
        let countdownInterval;
        let setupInterval;
        let timeLeft = 60;
        let gameState = 'menu';

        const radius = 21.73;
        const diameter = radius * 2;
        let x, y;
        let dx = 0.8; 
        let dy = 0.8; 

        let activeDotIndex = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            if (gameState === 'phase1') {
                if (x > canvas.width - radius) x = canvas.width - radius;
                if (x < radius) x = radius;
                if (y > canvas.height - radius) y = canvas.height - radius;
                if (y < radius) y = radius;
            }
        }
        
        window.addEventListener('resize', () => {
            setTimeout(resizeCanvas, 150); 
        });

        function animate() {
            if (gameState !== 'phase1' && gameState !== 'phase2') return;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'phase1') {
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
                ctx.closePath();

                if (x + dx > canvas.width - radius || x + dx < radius) {
                    dx = -dx;
                }
                if (y + dy > canvas.height - radius || y + dy < radius) {
                    dy = -dy;
                }

                x += dx;
                y += dy;

            } else if (gameState === 'phase2') {
                const totalGridWidth = diameter * 9;
                const startX = (canvas.width - totalGridWidth) / 2 + radius;
                const centerY = canvas.height / 2;

                for (let i = 0; i < 5; i++) {
                    const dotX = startX + (i * diameter * 2);
                    ctx.beginPath();
                    ctx.arc(dotX, centerY, radius, 0, Math.PI * 2);
                    
                    if (i === activeDotIndex) {
                        ctx.fillStyle = '#000000';
                        ctx.fill();
                    } else {
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.closePath();
                }
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        function showWorkoutMenu() {
            gameState = 'workouts';
            mainMenu.style.display = 'none';
            workoutMenu.style.display = 'flex';
        }

        function startSetupSequence(workoutType) {
            gameState = 'setup';
            workoutMenu.style.display = 'none';
            countdownScreen.style.display = 'flex';

            let setupTimeLeft = 5;
            countdownNumber.textContent = setupTimeLeft;

            setupInterval = setInterval(() => {
                setupTimeLeft--;
                countdownNumber.textContent = setupTimeLeft;

                if (setupTimeLeft <= 0) {
                    clearInterval(setupInterval);
                    startGame();
                }
            }, 1000);
        }

        function startGame() {
            gameState = 'phase1';
            timeLeft = 60;

            countdownScreen.style.display = 'none';
            canvas.style.display = 'block';
            timerHUD.style.display = 'block';

            resizeCanvas();

            x = window.innerWidth / 2;
            y = window.innerHeight / 2;

            startTimer();
            animate();
        }

        function startTimer() {
            updateTimerDisplay();

            countdownInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (gameState === 'phase2' && timeLeft % 5 === 0 && timeLeft > 0) {
                    chooseRandomDot();
                }

                if (timeLeft <= 0) {
                    if (gameState === 'phase1') {
                        switchToPhase2();
                    } else if (gameState === 'phase2') {
                        endGame();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerHUD.textContent = `${minutes}:${seconds}`;
        }

        function chooseRandomDot() {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * 5);
            } while (nextIndex === activeDotIndex);
            activeDotIndex = nextIndex;
        }

        function switchToPhase2() {
            gameState = 'phase2';
            timeLeft = 60;
            updateTimerDisplay();
            chooseRandomDot();
        }

        function endGame() {
            gameState = 'gameover';
            clearInterval(countdownInterval);
            cancelAnimationFrame(animationFrameId);

            canvas.style.display = 'none';
            timerHUD.style.display = 'none';
            gameOverMenu.style.display = 'flex';
        }

        function returnToWorkouts() {
            gameState = 'workouts';
            gameOverMenu.style.display = 'none';
            workoutMenu.style.display = 'flex';
        }
    </script>
</body>
</html>
