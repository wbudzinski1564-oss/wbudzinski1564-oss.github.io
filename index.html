<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event A Peak Detector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        button {
            padding: 14px 28px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            margin-bottom: 25px;
        }
        button:disabled { background-color: #475569; }
        .event-box {
            font-size: 32px;
            font-weight: bold;
            padding: 30px;
            border-radius: 12px;
            background-color: #1e293b;
            transition: background-color 0.1s ease;
            min-height: 50px;
        }
        .event-a { background-color: #0284c7; color: white; }
        
        .meter {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }
        .bar-bg { width: 100%; height: 16px; background: #334155; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        .bar-fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.03s ease; }
    </style>
</head>
<body>

<div class="container">
    <h1>Event A Waveform Peak Detector</h1>
    <p>Triggers on sudden short-duration transients (Event A).</p>

    <button id="startButton">Start Listening</button>

    <div id="display" class="event-box">Inactive</div>

    <div class="meter">
        <div>Instantaneous Peak Amplitude: <strong id="peak-val">0</strong></div>
        <div class="bar-bg"><div id="bar" class="bar-fill"></div></div>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startButton');
    const displayDiv = document.getElementById('display');
    const peakVal = document.getElementById('peak-val');
    const bar = document.getElementById('bar');

    let audioContext;
    let analyser;
    let isListening = false;
    let isProcessing = false;

    startBtn.addEventListener('click', async () => {
        if (isListening) return;

        try {
            // High-pass filter via AudioContext to eliminate lower/mid clap resonances
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false 
                } 
            });
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);

            // Filter out everything below 4000 Hz (Clap mid-range body)
            const highpass = audioContext.createBiquadFilter();
            highpass.type = "highpass";
            highpass.frequency.value = 4000;

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 64; // Tiny buffer size to catch extremely fast clicks

            source.connect(highpass);
            highpass.connect(analyser);

            isListening = true;
            startBtn.disabled = true;
            displayDiv.innerText = "Listening for Event A...";

            detectPeak();
        } catch (err) {
            alert("Microphone access failed: " + err.message);
        }
    });

    function detectPeak() {
        const bufferLength = analyser.fftSize;
        const timeData = new Uint8Array(bufferLength);

        function analyze() {
            if (!isListening) return;

            // Get raw PCM time-domain amplitude instead of frequency spectrum
            analyser.getByteTimeDomainData(timeData);

            // Calculate peak displacement from center (128)
            let maxPeak = 0;
            for (let i = 0; i < bufferLength; i++) {
                const deviation = Math.abs(timeData[i] - 128);
                if (deviation > maxPeak) {
                    maxPeak = deviation;
                }
            }

            // Update UI meter
            peakVal.innerText = maxPeak;
            bar.style.width = Math.min(100, (maxPeak / 64) * 100) + '%';

            // Trigger threshold for filtered high-pass click peak
            const PEAK_THRESHOLD = 12; 

            if (!isProcessing && maxPeak >= PEAK_THRESHOLD) {
                triggerEventA();
            }

            requestAnimationFrame(analyze);
        }

        analyze();
    }

    function triggerEventA() {
        isProcessing = true;
        displayDiv.innerText = "EVENT A DETECTED!";
        displayDiv.className = "event-box event-a";

        setTimeout(() => {
            displayDiv.innerText = "Listening for Event A...";
            displayDiv.className = "event-box";
            isProcessing = false;
        }, 400);
    }
</script>
</body>
</html>
