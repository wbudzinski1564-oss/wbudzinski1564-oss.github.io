<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Detector - Text Version</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .box {
            max-width: 350px;
            margin: 40px auto;
            background: #222;
            padding: 20px;
            border-radius: 8px;
        }
        .count { font-size: 4rem; margin: 10px 0; color: #00ffcc; }
        .status { color: #aaa; margin-bottom: 20px; font-weight: bold;}
        .row { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.8rem; color: #ccc; margin-bottom: 4px;}
        input { width: 100%; }
        button { width: 100%; padding: 12px; background: #00ffcc; color: #000; border: none; border-radius: 4px; font-weight: bold; margin-top: 10px;}
    </style>
</head>
<body>

<div class="box">
    <h2>Triggers:</h2>
    <div class="count" id="c">0</div>
    <div class="status" id="s">Stopped</div>

    <div class="row">
        <label>Main Trigger Level: <span id="m_v">50</span></label>
        <input type="range" id="m_s" min="5" max="100" value="50">
    </div>
    <div class="row">
        <label>Secondary Level: <span id="sec_v">30</span></label>
        <input type="range" id="sec_s" min="5" max="100" value="30">
    </div>
    <div class="row">
        <label>Cool-down Lockout: <span id="cd_v">500ms</span></label>
        <input type="range" id="cd_s" min="100" max="2000" step="50" value="500">
    </div>

    <button id="btn">Start Audio</button>
</div>

<script>
    let ctx, cv, arr, active = false, cd = false, total = 0, state = 0;
    const btn = document.getElementById('btn'), s = document.getElementById('s'), c = document.getElementById('c');
    const ms = document.getElementById('m_s'), mv = document.getElementById('m_v');
    const ss = document.getElementById('sec_s'), sv = document.getElementById('sec_v');
    const cs = document.getElementById('cd_s'), cv_lbl = document.getElementById('cd_v');

    ms.oninput = () => mv.innerText = ms.value;
    ss.oninput = () => sv.innerText = ss.value;
    cs.oninput = () => cv_lbl.innerText = cs.value + 'ms';

    btn.onclick = async () => {
        if (active) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            const src = ctx.createMediaStreamSource(stream);
            cv = ctx.createAnalyser();
            cv.fftSize = 256;
            arr = new Uint8Array(cv.frequencyBinCount);
            src.connect(cv);
            active = true;
            s.innerText = "Waiting for Main Spike...";
            btn.style.display = 'none';
            loop();
        } catch (e) { alert("Mic access required."); }
    };

    function loop() {
        if (!active) return;
        cv.getByteFrequencyData(arr);
        let max = 0;
        for (let i = 0; i < arr.length; i++) { if (arr[i] > max) max = arr[i]; }
        const vol = Math.round((max / 255) * 100);

        if (!cd) {
            if (state === 0 && vol >= parseInt(ms.value)) {
                cd = true; total++; c.innerText = total; state = 1;
                s.innerText = "Triggered! Need 2 secondary hits.";
                setTimeout(() => { cd = false; }, parseInt(cs.value));
            } else if (state === 1 && vol >= parseInt(ss.value)) {
                cd = true; state = 2;
                s.innerText = "Hit 1/2. Need 1 more.";
                setTimeout(() => { cd = false; }, parseInt(cs.value));
            } else if (state === 2 && vol >= parseInt(ss.value)) {
                cd = true; state = 0;
                s.innerText = "Sequence complete. Waiting for Main...";
                setTimeout(() => { cd = false; }, parseInt(cs.value));
            }
        }
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
