<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instantaneous Sound A Detector</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 40px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        button {
            padding: 16px 32px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        button:disabled { background-color: #475569; box-shadow: none; }
        .event-box {
            font-size: 32px;
            font-weight: bold;
            padding: 35px;
            border-radius: 12px;
            background-color: #1e293b;
            transition: background-color 0.05s ease;
            min-height: 40px;
            border: 2px solid #334155;
        }
        .event-a { 
            background-color: #0284c7; 
            border-color: #38bdf8;
            color: white; 
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }
        
        .controls {
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 5px; }
        input[type=range] { width: 100%; }
        .val { float: right; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Instantaneous Sound A Detector</h1>
    <p>Zero-latency bandpass analysis tuned to Sound A's acoustic pop.</p>

    <button id="startButton">Start Listening</button>

    <div id="display" class="event-box">Inactive</div>

    <div class="controls">
        <div class="control-group">
            <label>Target Frequency (Sound A Pitch): <span id="freq-val" class="val">1600 Hz</span></label>
            <input type="range" id="freq-slider" min="800" max="3000" value="1600" step="50">
        </div>

        <div class="control-group">
            <label>Detection Threshold: <span id="thresh-val" class="val">18</span></label>
            <input type="range" id="thresh-slider" min="5" max="60" value="18">
        </div>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startButton');
    const displayDiv = document.getElementById('display');
    const freqSlider = document.getElementById('freq-slider');
    const threshSlider = document.getElementById('thresh-slider');
    const freqVal = document.getElementById('freq-val');
    const threshVal = document.getElementById('thresh-val');

    let audioContext;
    let analyser;
    let isListening = false;
    let isProcessing = false;

    freqSlider.oninput = () => freqVal.innerText = freqSlider.value + " Hz";
    threshSlider.oninput = () => threshVal.innerText = threshSlider.value;

    startBtn.addEventListener('click', async () => {
        if (isListening) return;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false 
                } 
            });
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);

            // 1. Narrow Bandpass Filter tuned to Sound A's resonant frequency
            const bandpass = audioContext.createBiquadFilter();
            bandpass.type = "bandpass";
            bandpass.frequency.value = parseInt(freqSlider.value);
            bandpass.Q.value = 4.0; // High Q isolates Sound A's specific tone from claps

            // 2. Highpass Filter to strip away low-frequency room rumble
            const highpass = audioContext.createBiquadFilter();
            highpass.type = "highpass";
            highpass.frequency.value = 800;

            // 3. Ultra-small Analyser Node for immediate sample reads
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 32; // Smallest allowable FFT size for sub-millisecond execution

            // Connect processing graph
            source.connect(highpass);
            highpass.connect(bandpass);
            bandpass.connect(analyser);

            // Dynamically update filter frequency when slider moves
            freqSlider.addEventListener('input', () => {
                bandpass.frequency.value = parseInt(freqSlider.value);
            });

            isListening = true;
            startBtn.disabled = true;
            displayDiv.innerText = "Listening for Sound A...";

            processInstantaneousAudio();
        } catch (err) {
            alert("Microphone access failed: " + err.message);
        }
    });

    function processInstantaneousAudio() {
        const bufferLength = analyser.fftSize;
        const timeData = new Uint8Array(bufferLength);

        function checkFrame() {
            if (!isListening) return;

            // Read raw PCM wave sample values directly
            analyser.getByteTimeDomainData(timeData);

            let maxDeviation = 0;
            for (let i = 0; i < bufferLength; i++) {
                const deviation = Math.abs(timeData[i] - 128);
                if (deviation > maxDeviation) {
                    maxDeviation = deviation;
                }
            }

            const threshold = parseInt(threshSlider.value);

            if (!isProcessing && maxDeviation >= threshold) {
                triggerInstantA();
            }

            requestAnimationFrame(checkFrame);
        }

        checkFrame();
    }

    function triggerInstantA() {
        isProcessing = true;
        
        // Execute trigger UI immediately
        displayDiv.innerText = "SOUND A DETECTED!";
        displayDiv.className = "event-box event-a";

        // Place your custom instantaneous trigger code here:
        console.log("Sound A detected instantly at: " + performance.now() + "ms");

        setTimeout(() => {
            displayDiv.innerText = "Listening for Sound A...";
            displayDiv.className = "event-box";
            isProcessing = false;
        }, 350);
    }
</script>
</body>
</html>
